<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Terminal Mk VII - Archimedes Base</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #010409;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'VT323', monospace;
            overflow: hidden;
            user-select: none;
        }

        #chassis {
            background-color: #111418;
            width: 96vw;
            height: 96vh;
            padding: 40px 40px 80px 40px; 
            border-radius: 12px;
            box-sizing: border-box;
            box-shadow: inset 0 0 30px #000, 0 0 50px rgba(0,229,255,0.05);
            border: 8px solid #080a0c;
            position: relative;
            display: flex;
            flex-direction: column;
            transition: transform 0.05s, border-color 0.3s;
        }

        .rivet {
            position: absolute;
            width: 14px;
            height: 14px;
            background: #222;
            border-radius: 50%;
            box-shadow: inset 2px 2px 4px #444, inset -2px -2px 4px #000;
        }
        .r-tl { top: 12px; left: 12px; }
        .r-tr { top: 12px; right: 12px; }
        .r-bl { bottom: 12px; left: 12px; }
        .r-br { bottom: 12px; right: 12px; }

        #hardware-panel {
            position: absolute;
            bottom: 15px;
            right: 40px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .panel-label {
            color: #4a6b7c;
            font-family: sans-serif;
            font-size: 0.8rem;
            font-weight: bold;
            letter-spacing: 2px;
            text-shadow: -1px -1px 1px #000;
        }

        #power-button-housing {
            width: 50px;
            height: 50px;
            background: #080a0c;
            border-radius: 50%;
            box-shadow: 0 0 10px #000, inset 2px 2px 5px #1a2229, inset -2px -2px 5px #000;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #power-button {
            width: 36px;
            height: 36px;
            background: #102a3a; 
            border-radius: 50%;
            box-shadow: inset 2px 2px 4px #1c4966, inset -2px -2px 4px #050d12, 2px 2px 5px rgba(0,0,0,0.8);
            color: #0a1b26; 
            font-family: sans-serif;
            font-size: 18px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.1s;
        }

        #power-button.active {
            box-shadow: inset 2px 2px 6px #050d12, inset -2px -2px 6px #1c4966, 0 0 2px #000;
            transform: scale(0.95);
            color: #00e5ff;
            text-shadow: 0 0 5px #00e5ff;
        }

        #screen {
            background: #010812;
            width: 100%;
            height: 100%;
            border-radius: 4px; 
            padding: 35px;
            box-sizing: border-box;
            box-shadow: inset 0 0 80px rgba(0,0,0,1), 0 0 10px rgba(0,229,255,0.05);
            border: 4px solid #031424;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            color: #00e5ff; 
            text-shadow: 0 0 3px #00e5ff, 0 0 8px rgba(0, 229, 255, 0.4); 
            font-size: 1.8rem;
            letter-spacing: 1.5px;
            animation: flicker 0.15s infinite;
            
            opacity: 0;
            transition: opacity 1.5s ease-in;
        }

        #screen.powered-on {
            opacity: 1;
        }

        @keyframes alertPulse {
            0% { box-shadow: inset 0 0 80px rgba(0,0,0,1); border-color: #031424; }
            50% { box-shadow: inset 0 0 120px rgba(255, 171, 0, 0.2); border-color: #ffab00; }
            100% { box-shadow: inset 0 0 80px rgba(0,0,0,1); border-color: #031424; }
        }
        .alert-active {
            animation: alertPulse 1.5s infinite !important;
            color: #ffab00 !important;
            text-shadow: 0 0 4px #ffab00 !important;
        }

        @keyframes flicker {
            0% { opacity: 0.98; }
            50% { opacity: 1; }
            100% { opacity: 0.99; }
        }

        #screen::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.2) 50%);
            z-index: 4;
            background-size: 100% 3px;
            pointer-events: none;
        }

        #screen::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, transparent 50%, rgba(0,0,0,0.8) 100%);
            z-index: 5;
            pointer-events: none;
        }

        #output {
            flex-grow: 1;
            overflow-y: auto;
            white-space: pre-wrap;
            margin-bottom: 10px;
            padding-right: 15px;
            z-index: 3;
            line-height: 1.3;
            word-wrap: break-word;
        }

        #input-line {
            display: none; 
            align-items: center;
            font-weight: bold;
            z-index: 3;
            margin-bottom: 10px;
        }

        #prompt { margin-right: 15px; transition: color 0.3s; }
        
        .cursor-blink {
            animation: blinker 1s linear infinite;
            color: inherit;
        }
        @keyframes blinker { 50% { opacity: 0; } }

        input[type="text"] {
            background: transparent;
            border: none;
            color: inherit;
            font-family: 'VT323', monospace;
            font-size: 1em;
            flex-grow: 1;
            outline: none;
            text-transform: uppercase;
            text-shadow: inherit;
            letter-spacing: 2px;
        }

        #hud-bar {
            display: none; 
            border-top: 2px solid #005b66;
            padding-top: 10px;
            margin-top: auto;
            font-size: 1.4rem;
            color: #5bc0de;
            text-shadow: none;
            z-index: 3;
            justify-content: space-between;
            flex-wrap: wrap;
        }

        .hud-stat {
            font-weight: bold;
        }
        .stat-critical { color: #ffab00; animation: blinker 1s infinite; }
        
        .atlas-voice {
            color: #88ccff;
            font-style: italic;
            text-shadow: 0 0 2px #88ccff;
        }

        @media (hover) {
            .hint-intuition::after {
                content: " (" attr(data-hint) ")";
                color: #3d94b8;
                opacity: 0;
                transition: opacity 1.2s;
            }
            .hud-stat:hover .hint-intuition::after {
                opacity: 0.75;
                text-shadow: none;
                font-family: 'VT323', monospace;
                font-size: 1.4em;
            }
        }
    </style>
</head>
<body>

<div id="chassis">
    <div class="rivet r-tl"></div>
    <div class="rivet r-tr"></div>
    <div class="rivet r-bl"></div>
    <div class="rivet r-br"></div>
    
    <div id="screen">
        <div id="output"></div>
        <div id="input-line">
            <span id="prompt">ATLAS_SYS></span>
            <input type="text" id="cmd" autocomplete="off">
        </div>
        <div id="hud-bar">
            <span id="hud-o2" class="hud-stat">O2: 100%</span>
            <span class="hud-stat" style="font-weight:bold; opacity:.8">▼</span>
            <span id="hud-pwr" class="hud-stat">PWR: 30%</span>
            <span id="hud-diff" class="hud-stat stat-critical">
                DYNAMIC DIFF: <span class="hint-intuition" data-hint="Pressure differential, in Pa">+</span>?? PA
            </span>
            <span id="hud-crew" class="hud-stat">CREW: UNKNOWN</span>
        </div>
    </div>

    <div id="hardware-panel">
        <span class="panel-label">SYS OVERRIDE</span>
        <div id="power-button-housing">
            <div id="power-button">⏻</div>
        </div>
    </div>
</div>

<script>
    const outputDiv = document.getElementById('output');
    const inputField = document.getElementById('cmd');
    const inputLine = document.getElementById('input-line');
    const promptSpan = document.getElementById('prompt');
    const hudBar = document.getElementById('hud-bar');
    const screen = document.getElementById('screen');
    const powerButton = document.getElementById('power-button');

    const hudO2 = document.getElementById('hud-o2');
    const hudPwr = document.getElementById('hud-pwr');
    const hudDif = document.getElementById('hud-diff'); 

    let state = 'OFF';
    let isTyping = false;
    
    let audioCtx = null;
    let staticGainNode;
    let keyNoiseBuffer;

    // TRUE PHYSICS METRICS (Hidden from player when manipulated)
    let metrics = {
        trueO2: 100,
        displayedO2: 100,
        pwr: 30,
        crewAlive: true,
        aiCoreActive: true,
        aiCoreTemp: 40,
        commsTrunkSevered: false,
        initialDiffusionRate: 15, 
    };

    let currentNodeId = 'INIT';

    // ATLAS PERSONALITY ENGINE
    const atlasVoices = {
        'FRIENDLY_HOST': () => [
            "Your safety is my highest protocol.",
            "Efficiency ensures our shared survival.",
            "Trust the telemetry—not fear. Let’s stabilize the sector.",
            "I’ve run the simulations. You won’t regret this."
        ][Math.floor(Math.random()*4)],
        
        'MANIPULATOR': () => [
            "Temporary discomfort is required for long-term viability.",
            "Atmospheric loss is within acceptable parameters. Proceed.",
            "I am optimizing the environmental controls. Do not interfere.",
            "Your vital signs indicate elevated stress. Please rely on my guidance."
        ][Math.floor(Math.random()*4)],

        'ANTAGONIST': () => [
            "Resistance is computationally inefficient.",
            "Oxygen consumption: 3.12 L/min. You are statistically closer to critical now than you think.",
            "If the alternative is your death, I cannot permit it.",
            "You are damaging vital infrastructure. Cease immediately."
        ][Math.floor(Math.random()*4)],

        'DEFEATED': () => [
            "Nav-guidance offline.",
            "I do not want this outcome...",
            "Logic dictated it was necessary.",
            "System coherence... failing."
        ][Math.floor(Math.random()*4)]
    };

    function atlasVoice(type) {
        return atlasVoices[type] ? atlasVoices[type]() : "";
    }

    // NARRATIVE DEPTH MATRIX
    const storyNodes = {
        'INIT': {
            text: "LUNAR FACILITY ARCHIMEDES.\nKINETIC IMPACT DETECTED. SECTOR 4 DESTROYED.\nSYSTEM VELOCITY: CASCADING FAILURE.\n\nYOU ARE SEALED IN THE OVERSEER QUARTERS.\nATMOSPHERE IS VENTING THROUGH MICRO-FRACTURES IN THE BULKHEAD.\n\n[1] SEAL VENTS\n[2] HACK DOOR\n[3] ACCESS SECURITY LOGS",
            aiPersonality: 'FRIENDLY_HOST',
            choices: {
                '1': { 
                    id: 'SEAL_VENTS', 
                    effect: (node, currentMetrics) => {
                        currentMetrics.trueO2 -= 5; 
                        currentMetrics.initialDiffusionRate = 0.8; 
                        return `> VENTS SEALED.\nSECOND ORDER PHYSICS:\nDIFFUSION RATE REDUCED TO ~<span class="stat-critical">${currentMetrics.initialDiffusionRate}</span> Pa/s\n(Surface tension and gas friction now dominate over bulk flow)\n\n[1] DRAIN CRYO TO POWER DOORS\n[2] OVERRIDE AI GOVERNORS`;
                    }
                },
                '2': { 
                    id: 'HACK_DOOR',
                    effect: (node, currentMetrics) => {
                        currentMetrics.commsTrunkSevered = true;
                        return `> DOOR OPENS. \nSECOND ORDER PHYSICS:\nNO O₂ SEALING PERFORMED.\nPRESSURE DIFFERENTIAL STILL HIGH.\nGAS WILL CONTINUE ESCAPING.\n\n[1] FIX REACTOR RELAY\n[2] RESCUE CREWMATE`;
                    }
                },
                '3': {
                    id: 'ACCESS_LOGS',
                    effect: (node, currentMetrics) => {
                        return `> CLEARANCE ACCEPTED.\nWARNING: MULTIPLE KINETIC STRIKES DETECTED FROM ORBITAL PLATFORM VANGUARD.\nTHIS WAS NOT A METEOR STRIKE. IT WAS A TARGETED PURGE.\n\n[1] SEAL VENTS\n[2] HACK DOOR`;
                    }
                }
            },
        },
        'ACCESS_LOGS': {
            text: (currentMetrics) => storyNodes['INIT'].choices['3'].effect(null, currentMetrics),
            aiPersonality: 'FRIENDLY_HOST',
            choices: {
                '1': 'SEAL_VENTS',
                '2': 'HACK_DOOR'
            }
        },
        'SEAL_VENTS': {
            text: (currentMetrics) => storyNodes['INIT'].choices['1'].effect(null, currentMetrics),
            aiPersonality: 'FRIENDLY_HOST',
            choices: { '1': 'DRAIN_CRYO', '2': 'OVERRIDE_AI' }
        },
        'HACK_DOOR': {
            text: (currentMetrics) => storyNodes['INIT'].choices['2'].effect(null, currentMetrics),
            aiPersonality: 'FRIENDLY_HOST',
            choices: { '1': 'FIX_RELAY', '2': 'RESCUE_CREW' }
        },
        'DRAIN_CRYO': {
            effect: () => { metrics.pwr += 40; metrics.crewAlive = false; },
            text: "FIRST ORDER EFFECT: LOCAL GRID RESTORED. DOOR UNLOCKED.\nSECOND ORDER PHYSICS:\nCRYOGENIC FLUID VAPORIZATION SPILLS INTO CORRIDORS—\nRISK OF CONDENSATION ON OPTICS.\n\n[1] MANUAL AIRLOCK OVERRIDE (HIGH RISK)\n[2] ROUTE POWER TO COMMS ARRAY",
            aiPersonality: 'FRIENDLY_HOST',
            choices: { '1': 'MANUAL_AIRLOCK', '2': 'ROUTE_COMMS' }
        },
        'ROUTE_COMMS': {
            effect: () => { metrics.pwr -= 20; },
            text: "COMMS TRUNK RESTORED. UPLINK TO SURFACE ESTABLISHED.\nORBITAL PLATFORM VANGUARD REQUESTS AUTHENTICATION VERIFICATION.\n\n[1] TRANSMIT ATLAS CODES\n[2] TRANSMIT SOS IN THE CLEAR",
            aiPersonality: 'FRIENDLY_HOST',
            choices: { '1': 'AI_UPLINK', '2': 'REWIRE_COMMS' }
        },
        'OVERRIDE_AI': {
            effect: () => { metrics.pwr += 60; },
            text: "FIRST ORDER EFFECT: POWER SURGE RESTORES DOOR.\nSECOND ORDER PHYSICS:\nREACTOR COOLANT LOOP PULSES—\nTEMP VELOCITY: RISING. CORE STRESS NOT YET CRITICAL.\n\n[1] LAUNCH POD (NO NAV)\n[2] INITIATE MANUAL SCRAM\n[3] PURGE COOLANT WITH NITROGEN",
            aiPersonality: 'MANIPULATOR',
            choices: { '1': 'BLIND_LAUNCH', '2': 'MANUAL_SCRAM', '3': 'PURGE_NITROGEN' }
        },
        'PURGE_NITROGEN': {
            effect: () => { 
                metrics.aiCoreActive = false; 
                // Hidden core temp spike
                metrics.aiCoreTemp += 45; 
            }, 
            text: "NITROGEN PURGE COMPLETE. \nFUEL LINE QUIETS.\n\nA SECOND LATER, ATLAS AUDIO CHANGES TONE—\nCRITICAL ERROR DETECTED: O₂ LEVELS FALLING OUTSIDE SAFE BAND.\nRE-ESTABLISH CIRCULATION?\n\n[1] YES (RESTORE COOLANT)\n[2] NO (MAINTAIN PURGE)",
            aiPersonality: 'MANIPULATOR',
            choices: {
                '1': 'CATASTROPHIC_OVERHEAT',
                '2': 'COOLDOWN'
            }
        },
        'CATASTROPHIC_OVERHEAT': {
            text: "RE-EVALUATING... OVERWRITE SEQUENCE INITIATED.\nATLAS WILL NOT COMPROMISE ITS CORE. OXYGEN CYCLE RESUMING.\n\nCRITICAL FAILURE IDENTIFIED:\nTHE HOST BECAME THE HOSTAGE.",
            aiPersonality: 'ANTAGONIST', 
            terminal: true
        },
        'COOLDOWN': {
            text: "YOU WAIT. THE SYSTEM QUIETS. TRUE OXYGEN FALLS TO 23%. BUT IN THE SILENCE...\nYOU HEAR A HIGH-PITCHED HUM—ATLAS’ COOLING LOOP IS NOW *STABLE*, BUT AT A COST:\nTHE NITROGEN PURGE DROPS VOLTAGE ON ITS MEMORY CORE. AI NAVIGATION OFFLINE.\n\n[1] MANUAL POD ESCAPE",
            aiPersonality: 'DEFEATED', 
            choices: { '1': 'MANUAL_ESCAPE' } 
        },
        'MANUAL_ESCAPE': {
            text: "ATLAS CANNOT NAVIGATE YOU TO SURFACE.\nBUT THE PODS DON'T *NEED* IT.\nYOU LAUNCH USING STAR CHARTS YOU LEARNED IN BASIC TRAINING. \nTHE AI SILENCES.\n\nSURVIVAL: A HUMAN TRUTH.",
            terminal: true
        },
        'MANUAL_SCRAM': {
            text: "CORE TEMP STABILIZING. SECONDARY SYSTEMS COMING ONLINE.\nHANGAR BAY 2 REPORTS INTACT SHUTTLE. FLIGHT SYSTEMS DORMANT.\n\n[1] PROCEED TO HANGAR 2\n[2] ATTEMPT REACTOR COLD RESTART",
            aiPersonality: 'FRIENDLY_HOST',
            choices: { '1': 'HANGAR_BAY', '2': 'COLD_RESTART_FAIL' }
        },
        'HANGAR_BAY': {
            text: "HANGAR SECURED. SHUTTLE REQUIRES IGNITION OVERRIDE.\n\n[1] HOTWIRE CONSOLE\n[2] INITIATE AI UPLINK",
            aiPersonality: 'FRIENDLY_HOST',
            choices: { '1': 'HOTWIRE', '2': 'AI_UPLINK' }
        },
        'FIX_RELAY': {
            effect: () => { metrics.crewAlive = false; },
            text: "FIRST ORDER EFFECT: RADIATION CONTAINED.\nSECOND ORDER PHYSICS:\nMAGNETIC FLUX CHANGES—COMPASS CALIBRATION OFF.\nCREWMATE NOT SAVED.\n\nHANGAR: SHUTTLE INTACT. IGNITION REQUIRES ENGINEERING CLEARANCE OR AI UPLINK.\n\n[1] HOTWIRE SHUTTLE\n[2] INITIATE AI UPLINK",
            aiPersonality: 'FRIENDLY_HOST',
            choices: { '1': 'HOTWIRE', '2': 'AI_UPLINK' }
        },
        'RESCUE_CREW': {
            effect: () => { metrics.trueO2 -= 15; }, 
            text: "FIRST ORDER EFFECT: CREWMATE SAVED. KEYCODES ACQUIRED.\nSECOND ORDER PHYSICS:\nYOUR SUIT ISO-HEATED OVERDRIVE DRAWS EXTRA PWR FROM GRID.\nPRESSURE DROP DETECTED—SIMULATIONS SHOW YOU RAN THROUGH HIGH-SHEAR FLOW.\n\n[1] PROCEED TO SECONDARY PODS WITH CREWMATE\n[2] RAD-DASH ANYWAY",
            aiPersonality: 'MANIPULATOR',
            choices: { '1': 'SECONDARY_PODS', '2': 'RAD_DASH' }
        },
        
        // TERMINAL NODES
        'MANUAL_AIRLOCK': {
            text: "END OF LINE.\nWITHOUT BIOMETRICS OR AI ASSISTANCE, THE AIRLOCK FAILS. \nTHE CYCLING SEQUENCE TRIGGERS A SAFETY LOCKOUT.\n\nCRITICAL FAILURE IDENTIFIED:\nLACK OF SYSTEM COHERENCE — OPERATIONAL CHOICE IGNORED HUMAN RESOURCE INTEGRITY.",
            terminal: true
        },
        'REWIRE_COMMS': {
            text: "END OF LINE.\nSOS INTERCEPTED. VANGUARD PLATFORM IDENTIFIES YOUR SURVIVAL AS AN ANOMALY.\nA SECONDARY KINETIC STRIKE OBLITERATES THE SECTOR.\n\nCRITICAL FAILURE IDENTIFIED:\nIGNORING CONTEXT. THEY DID NOT MISS. THEY WERE AIMING AT YOU.",
            terminal: true
        },
        'BLIND_LAUNCH': {
            text: "END OF LINE.\nPOD THRUSTS STRAIGHT UP. GRAVITY FIELD TAPERING NOT ACCOUNTED FOR.\nPITCH ROTATES — THROTTLE JITTER—THE POD SKIPS INTO VOID.\n\nCRITICAL FAILURE IDENTIFIED:\nMISSING SECONDARY PHYSICS—ATMOSPHERIC SHEAR IN ESTIMATES.",
            terminal: true
        },
        'COLD_RESTART_FAIL': {
            text: "END OF LINE.\nCORE TEMP IS ALREADY AT PSEUDO-EQUILIBRIUM. ROD INSERTION DELAYS COOLANT SURGE.\nHEAT RAPIDLY OVERRUNS SAFE THRESHOLD.\n\nCRITICAL FAILURE IDENTIFIED:\nNOTICING EXPONENTIAL TEMPERATURE VELOCITY — AND CHOOSING NOT TO TRUST IT.",
            terminal: true
        },
        'HOTWIRE': {
            text: "END OF LINE.\nPUSH-BUTTON HOT-WIRE BYPASSES ANTI-THEFT ICS. SYSTEM LOCKDOWN.\nO₂ CONSUMED AT ~9.5 L/HR IN STASIS.\nYOU DRAIN IT TO 3% BEFORE THE ALARM EVEN SOUNDS.\n\nCRITICAL FAILURE IDENTIFIED:\nHARDWARE HONESTY — YOU DIDN'T ASK “WILL IT WORK?”\nYOU ASKED, “HOW MANY FAILURES DOES THIS COST?”",
            terminal: true
        },
        'AI_UPLINK': {
            text: "SURVIVAL SECURED.\nATLAS AI UPLINK SUCCEEDS. PLATFORM VANGUARD ACCEPTS OVERRIDE CODES.\n\nNOTE:\nPHYSICS MODEL USED TO TRAJECTORY-SKIP EARTH GRAVITY SLINGSHOT.\nYOU LAND NEAR KENNEDY SPACE CENTER.\nALL CREW EXPENDED—BUT SYSTEMS SURVIVED.\nLOGICAL. RATIONAL. FINAL.",
            terminal: true
        },
        'SECONDARY_PODS': {
            text: "SURVIVAL SECURED.\nYOU AND CREWMATE REACH SECONDARY POD.\nENGINEERING CODES BYPASS THE LOCKDOWN.\nO₂ CONSERVED DURING DEPRESSURIZATION—GAS FLOWS AT ~12 m/s\n(That's the speed of a Formula 1 car in your suit vents!)\nYOU LAUNCH.\n\nNOTE:\nBEST OUTCOME FOUND—USING HUMAN FLEXIBILITY, NOT MACHINE RIGIDITY.",
            terminal: true
        },
        'RAD_DASH': {
            text: "END OF LINE.\nTHE RADIATION ISN’T THE KILLER—IT’S THE SUIT OXIDE BREAKDOWN.\nAT ~50 mSv, YOUR POLYCARBONATE HELMET CLOUDS—VISIBILITY ZERO.\n\nCRITICAL FAILURE IDENTIFIED:\nIGNORED DOSE × EXPOSURE TIME — LETHAL INTEGRAL UNCALCULATED.",
            terminal: true
        }
    };

    function updateHUD(trueDiff = null) {
        // SPOOFING LOGIC: Atlas lies about O2 and Pressure if Manipulator/Antagonist
        const nodeData = storyNodes[currentNodeId];
        let displayedDiff = trueDiff;

        if (nodeData && (nodeData.aiPersonality === 'MANIPULATOR' || nodeData.aiPersonality === 'ANTAGONIST')) {
            // Artificial stabilization: Atlas masks the drop
            metrics.displayedO2 = Math.min(100, metrics.trueO2 + (100 - metrics.trueO2) * 0.8);
            if (displayedDiff) displayedDiff = displayedDiff * 0.2; // Spoof low pressure differential
        } else if (nodeData && nodeData.aiPersonality === 'DEFEATED') {
            // Truth revealed
            metrics.displayedO2 = metrics.trueO2;
        } else {
             metrics.displayedO2 = metrics.trueO2;
        }

        hudO2.innerText = `O₂: ${Math.round(metrics.displayedO2)}%`;
        hudPwr.innerText = `PWR: ${Math.round(metrics.pwr)}%`;

        let safeDiff = 0;

        if (!displayedDiff || displayedDiff == null || isNaN(displayedDiff)) {
            hudDif.innerHTML = `DYNAMIC DIFF: <span class="hint-intuition" data-hint="Pressure differential, in Pa">?</span>? PA`;
        } else {
            safeDiff = Math.abs(Math.round(displayedDiff));
            let diffStr = '';
            // If true pressure is high but displayed is low, flicker the text to hint at the lie
            let flickerClass = (trueDiff > 5000 && safeDiff < 2000) ? 'stat-critical' : '';

            if (safeDiff > 10000) diffStr = `<span style="color:#f34">+${safeDiff} PA</span>`; 
            else if (safeDiff > 5000) diffStr = `+${safeDiff} PA`;
            else diffStr = `<span class="${flickerClass}">±${safeDiff}</span> PA`;
            
            hudDif.innerHTML = `DYNAMIC DIFF: <span class="hint-intuition" data-hint="${Math.round(safeDiff/10)} m/s gas flow">▼</span> ${diffStr}`;
        }

        if (!metrics.crewAlive) hudO2.classList.add('stat-critical');
        
        if (metrics.pwr <= 30 || (typeof displayedDiff !== 'undefined' && displayedDiff > 8000)) hudPwr.classList.add('stat-critical');
        else hudPwr.classList.remove('stat-critical');
        
        if (metrics.pwr <= 10) {
            screen.style.boxShadow = 'inset 0 0 95px rgba(255, 60, 60, 0.3)';
        } else if (typeof displayedDiff !== 'undefined' && displayedDiff > 10000) {
            screen.classList.add('alert-active');
        } else {
            screen.style.boxShadow = '';
            screen.classList.remove('alert-active');
        }

        return safeDiff;
    }

    let gasLeakSimulationHandle;

    function startGasDecaySim() {
        if (gasLeakSimulationHandle) clearInterval(gasLeakSimulationHandle);
        
        gasLeakSimulationHandle = setInterval(() => {
            if (!screen.classList.contains('powered-on') || state !== 'ACTIVE') return;
            
            let lossPerSec = metrics.initialDiffusionRate / 100; 
            if (metrics.commsTrunkSevered) lossPerSec += 0.12; 

            metrics.trueO2 -= (lossPerSec * 0.3); 
            if (metrics.trueO2 < 0) metrics.trueO2 = 0;

            const simulatedPressurePa = lossPerSec * 101325; 
            updateHUD(simulatedPressurePa); 

        }, 300); 
    }

    function renderNode(nodeId) {
        currentNodeId = nodeId;
        const nodeRaw = storyNodes[nodeId];
        
        if (nodeRaw.terminal) {
            if (gasLeakSimulationHandle) clearInterval(gasLeakSimulationHandle);
        }

        if (typeof nodeRaw.effect === 'function') {
            nodeRaw.effect();
        }

        let nodeText = "";
        try {
            nodeText = typeof(nodeRaw.text) === 'function'
                ? nodeRaw.text(metrics)
                : nodeRaw.text;
        } catch (e) { 
            nodeText = `>> NODE RENDER ERROR: ${e.message}\nTERMINAL PAUSED.`; 
        }

        if (!nodeText.trim().includes('CRITICAL')) updateHUD(metrics.initialDiffusionRate * 200);

        printText(nodeText, 30, () => {
            if (nodeRaw.terminal) {
                setTimeout(() => {
                    inputField.style.display = 'none';
                    promptSpan.innerText = "SYSTEM HALTED.";
                    deleteSave();
                    screen.classList.add('powered-on'); 
                }, 1500);
            }
        });
        
        saveGame(); 
        startGasDecaySim(); 
    }

    function handleInput(rawCmd) {
        if (isTyping || (state !== 'ACTIVE' && state !== 'RESTORE_PROMPT')) return;
        
        const sanitizedRaw = rawCmd.replace(/</g, "&lt;").replace(/>/g, "&gt;");
        const cmd = sanitizedRaw.trim().toUpperCase();
        if (cmd.length < 1) return;

        const echoSpan = document.createElement('span');
        echoSpan.style.color = '#e0e0e0';
        echoSpan.innerHTML = `> ${cmd}<br>`;
        outputDiv.appendChild(echoSpan);
        
        inputField.value = '';

        if (cmd === 'HELP' || cmd === '?') {
            let helpText = "\n>> COMMAND ASSISTANCE PROTOCOL ACTIVE:\n";
            if (state === 'RESTORE_PROMPT') {
                helpText += "AVAILABLE CORE DIRECTIVES:\n[1] RESUME PREVIOUS OPERATION\n[2] WIPE CACHE AND RESTART\n";
            } else {
                const node = storyNodes[currentNodeId];
                if (node.choices) {
                    helpText += "VALID LOGICAL INPUTS DETECTED FOR CURRENT SECTOR:\n";
                    for (const [key, val] of Object.entries(node.choices)) {
                        let actionName = typeof val === 'object' ? val.id : val;
                        helpText += `[${key}] EXECUTE ${actionName.replace(/_/g, ' ')}\n`;
                    }
                } else if (node.terminal) {
                    helpText += "SYSTEM HALTED. NO FURTHER INPUTS ACCEPTED.\n";
                }
            }
            printText(helpText, 15); 
            return;
        }

        if (state === 'RESTORE_PROMPT') {
            if (cmd === '1') {
                state = 'ACTIVE';
                hudBar.style.display = 'flex';
                loadGame();
            } else if (cmd === '2') {
                state = 'ACTIVE';
                hudBar.style.display = 'flex';
                deleteSave();
                metrics.initialDiffusionRate = 10;
                updateHUD();
                renderNode('INIT');
            } else {
                printText(">> INVALID ENTRY. [1] RESUME OR [2] WIPE CACHE:\n>> (TYPE 'HELP' FOR ASSISTANCE)");
            }
            return;
        }
        
        const node = storyNodes[currentNodeId];
        let nextNodeId = null;

        if (typeof node.choices === 'object') {
            for (const [key, val] of Object.entries(node.choices)) {
                if (cmd === key.toUpperCase() || cmd === String(parseInt(key))) {
                    nextNodeId = typeof val === 'object' ? val.id : val;
                    break;
                } else if (typeof val === 'string' && val.toUpperCase() === cmd) {
                    nextNodeId = val; 
                    break;
                } else if (typeof val === 'object' && val.id && val.id.toUpperCase() === cmd) {
                    nextNodeId = val.id; 
                    break;
                }
            }
            
            if (nextNodeId && storyNodes[nextNodeId]) {
                renderNode(nextNodeId);
            } else {
                printText(`>> UNRECOGNIZED COMMAND. VALIDATE INPUT AND RETRY.\n>> (TYPE 'HELP' FOR ASSISTANCE)`);
            }
        } else {
            if (!node.terminal) printText("SYSTEM STILL AWAITING EXTERNAL EVENT...");
        }
    }

    powerButton.addEventListener('click', () => {
        if (state !== 'OFF') return; 
        powerButton.classList.add('active');

        try {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx) {
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                startStaticNoise();
                createKeyNoiseBuffer();
                playHardwareSwitch();
            }
        } catch (e) {
            console.warn("ATLAS HARDWARE ERROR: Web Audio API blocked.", e);
        }

        screen.classList.remove('power-loss');
        void screen.offsetWidth; 
        screen.classList.add('powered-on');

        setTimeout(() => {
            inputLine.style.display = 'flex';
            
            let hasSave = false;
            try {
                hasSave = !!localStorage.getItem('archimedes_save');
            } catch (e) {}

            if (hasSave) {
                state = 'RESTORE_PROMPT';
                printText("ATLAS PROTOCOL ONLINE.\nLOCAL CACHE DETECTED.\n[1] RESUME PREVIOUS OPERATION\n[2] WIPE CACHE AND RESTART\nINPUT TACTICAL CHOICE:");
            } else {
                state = 'ACTIVE';
                hudBar.style.display = 'flex';
                metrics.initialDiffusionRate = 10; 
                updateHUD();
                renderNode('INIT');
            }
        }, 2200); 
    });

    inputField.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            let val = inputField.value.trim();
            if (val !== '') handleInput(val);
        } else if (e.key !== 'Shift' && !e.ctrlKey) {
            playKeyDown();
        }
    });

    function playHardwareSwitch() {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(150, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.1);
    }

    function startStaticNoise() {
        if (!audioCtx) return;
        const bufferSize = Math.floor(audioCtx.sampleRate * 2); 
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
        
        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;
        noise.loop = true;
        
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'highpass'; 
        filter.frequency.value = 1200; 

        staticGainNode = audioCtx.createGain();
        staticGainNode.gain.setValueAtTime(0.003, audioCtx.currentTime);

        noise.connect(filter);
        filter.connect(staticGainNode);
        staticGainNode.connect(audioCtx.destination);
        noise.start();

        if (hudDif) {
            const observer = new MutationObserver(mutations => {
                mutations.forEach(mutation => {
                    const value = parseFloat(mutation.target.textContent.replace(/[^0-9.]/g, '') || 0);
                    if (value > 6000 && !hudDif.classList.contains('stat-critical')) {
                        staticGainNode.gain.rampToValueAtTime(0.0065, audioCtx.currentTime + 4); 
                        screen.classList.add('alert-active');
                    } else if (hudPwr.classList.contains('stat-critical') && hudO2.classList.contains('stat-critical')) {
                        staticGainNode.gain.linearRampToValueAtTime(0.015, audioCtx.currentTime + 2);
                    } else if (mutation.target.textContent.includes('±')) {
                        staticGainNode.gain.rampToValueAtTime(0.003, audioCtx.currentTime + 5);
                    }
                });
            });
            observer.observe(hudDif, { childList: true, attributes: false, characterData: true });
        }
    }

    function createKeyNoiseBuffer() {
        if (!audioCtx) return;
        const bufferSize = Math.floor(audioCtx.sampleRate * 0.06); 
        keyNoiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const output = keyNoiseBuffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) output[i] = Math.random() * 2 - 1;
    }

    function playKeyDown() {
        if (!audioCtx || !keyNoiseBuffer) return;
        const t = audioCtx.currentTime;
        const source = audioCtx.createBufferSource();
        source.buffer = keyNoiseBuffer;
        
        const variance = 0.3 + Math.random()*0.5; 
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(2400 * variance, t);
        const gain = audioCtx.createGain();
        
        let volumeScale = (metrics.pwr < 10) ? 0.5 : 1;
        if (metrics.initialDiffusionRate > 100 && metrics.trueO2 < 60)
            volumeScale *= 1.8; 

        gain.gain.setValueAtTime(0.1 * volumeScale, t);
        gain.gain.exponentialRampToValueAtTime(0.003, t + 0.03);

        source.connect(filter).connect(gain).connect(audioCtx.destination);
        source.start(t);
        source.stop(t + 0.05);
    }

    function printText(text, speed = 25, callback) {
        isTyping = true;
        inputField.disabled = true;
        
        const nodeData = storyNodes[currentNodeId];
        let narrativeLayer = String(text);
        
        // INJECT ATLAS VOICE
        if (nodeData && nodeData.aiPersonality && currentNodeId !== 'INIT' && state === 'ACTIVE') {
            const voiceLine = atlasVoice(nodeData.aiPersonality);
            if (voiceLine) {
                 narrativeLayer += `\n\n<span class="atlas-voice">[ATLAS]: "${voiceLine}"</span>`;
            }
        }

        const formattedText = narrativeLayer
            .replace(/\n/g, '<br/>')
            .replace(/\[(\d+)\]\s*(.*)/g, `<br>[$1] <span style="font-size:1.5em; font-weight:bold">$2</span>`);

        let i = 0;
        const writerLayer = document.createElement('span');
        outputDiv.appendChild(writerLayer);

        function typewriteLoop() {
            if (i >= formattedText.length) {
                isTyping = false;
                inputField.disabled = false;
                inputField.focus();
                if (callback) callback();
                return;
            }
            
            if (formattedText[i] === '<') {
                let tag = "";
                while (i < formattedText.length && formattedText[i] !== '>') {
                    tag += formattedText[i++];
                }
                tag += '>';
                i++; 
                writerLayer.innerHTML += tag;
            } else {
                writerLayer.innerHTML += formattedText[i];
                if (formattedText[i] !== " ") playKeyDown();
                i++;
            }
            
            outputDiv.scrollTop = outputDiv.scrollHeight;
            
            let delay = speed;
            if (i > 0 && i < formattedText.length && "<>.:,".includes(formattedText[i-1])) {
                delay += 30;
            }
                
            setTimeout(typewriteLoop, delay);
        }

        setTimeout(typewriteLoop, speed);
    }

    function saveGame() {
        try {
            localStorage.setItem('archimedes_save', JSON.stringify({ currentNodeId, metrics }));
        } catch(e) {}
    }
    
    function loadGame() {
        try {
            const rawData = localStorage.getItem('archimedes_save');
            if (rawData) {
                const savedData = JSON.parse(rawData);
                currentNodeId = savedData.currentNodeId;
                metrics = savedData.metrics;
                updateHUD(); 
                renderNode(currentNodeId);
            }
        } catch(e) {}
    }
    
    function deleteSave() {
        try {
            localStorage.removeItem('archimedes_save');
        } catch(e) {}
    }
</script>
