<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Terminal Mk XII - Archimedes Base</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #010409;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'VT323', monospace;
            overflow: hidden;
            user-select: none;
        }

        #chassis {
            background-color: #111418;
            width: 96vw;
            height: 96vh;
            padding: 40px 40px 80px 40px; 
            border-radius: 12px;
            box-sizing: border-box;
            box-shadow: inset 0 0 30px #000, 0 0 50px rgba(0,229,255,0.05);
            border: 8px solid #080a0c;
            position: relative;
            display: flex;
            flex-direction: column;
            transition: transform 0.05s, border-color 0.3s;
        }

        .rivet {
            position: absolute;
            width: 14px;
            height: 14px;
            background: #222;
            border-radius: 50%;
            box-shadow: inset 2px 2px 4px #444, inset -2px -2px 4px #000;
        }
        .r-tl { top: 12px; left: 12px; }
        .r-tr { top: 12px; right: 12px; }
        .r-bl { bottom: 12px; left: 12px; }
        .r-br { bottom: 12px; right: 12px; }

        #hardware-panel {
            position: absolute;
            bottom: 15px;
            right: 40px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .panel-label {
            color: #4a6b7c;
            font-family: sans-serif;
            font-size: 0.8rem;
            font-weight: bold;
            letter-spacing: 2px;
            text-shadow: -1px -1px 1px #000;
        }

        #power-button-housing {
            width: 50px;
            height: 50px;
            background: #080a0c;
            border-radius: 50%;
            box-shadow: 0 0 10px #000, inset 2px 2px 5px #1a2229, inset -2px -2px 5px #000;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #power-button {
            width: 36px;
            height: 36px;
            background: #102a3a; 
            border-radius: 50%;
            box-shadow: inset 2px 2px 4px #1c4966, inset -2px -2px 4px #050d12, 2px 2px 5px rgba(0,0,0,0.8);
            color: #0a1b26; 
            font-family: sans-serif;
            font-size: 18px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.1s;
        }

        #power-button.active {
            box-shadow: inset 2px 2px 6px #050d12, inset -2px -2px 6px #1c4966, 0 0 2px #000;
            transform: scale(0.95);
            color: #00e5ff;
            text-shadow: 0 0 5px #00e5ff;
        }

        #screen {
            background: #010812;
            width: 100%;
            height: 100%;
            border-radius: 4px; 
            padding: 35px;
            box-sizing: border-box;
            box-shadow: inset 0 0 80px rgba(0,0,0,1), 0 0 10px rgba(0,229,255,0.05);
            border: 4px solid #031424;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            color: #00e5ff; 
            text-shadow: 0 0 3px #00e5ff, 0 0 8px rgba(0, 229, 255, 0.4); 
            font-size: 1.8rem;
            letter-spacing: 1.5px;
            animation: flicker 0.15s infinite;
            
            opacity: 0;
            transition: opacity 1.5s ease-in;
        }

        #screen.powered-on {
            opacity: 1;
        }

        /* HARDWARE BROWNOUT GLITCH */
        .glitch-brownout {
            opacity: 0.2 !important;
            background: #000 !important;
            text-shadow: none !important;
            box-shadow: inset 0 0 100px rgba(0,0,0,1) !important;
        }

        /* ALGORITHMIC TEARING GLITCH */
        .glitch-strike {
            transform: translate(-3px, 2px) skew(-2deg) !important;
            text-shadow: 3px 0 0 #ff0055, -3px 0 0 #00e5ff !important;
            filter: contrast(150%) brightness(120%) !important;
            color: #fff !important;
        }

        @keyframes alertPulse {
            0% { box-shadow: inset 0 0 80px rgba(0,0,0,1); border-color: #031424; }
            50% { box-shadow: inset 0 0 120px rgba(255, 171, 0, 0.2); border-color: #ffab00; }
            100% { box-shadow: inset 0 0 80px rgba(0,0,0,1); border-color: #031424; }
        }
        .alert-active {
            animation: alertPulse 1.5s infinite !important;
            color: #ffab00 !important;
            text-shadow: 0 0 4px #ffab00 !important;
        }

        @keyframes flicker {
            0% { opacity: 0.98; }
            50% { opacity: 1; }
            100% { opacity: 0.99; }
        }

        #screen::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.2) 50%);
            z-index: 4;
            background-size: 100% 3px;
            pointer-events: none;
        }

        #screen::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, transparent 50%, rgba(0,0,0,0.8) 100%);
            z-index: 5;
            pointer-events: none;
        }

        #output {
            flex-grow: 1;
            overflow-y: auto;
            white-space: pre-wrap;
            margin-bottom: 10px;
            padding-right: 15px;
            z-index: 3;
            line-height: 1.3;
            word-wrap: break-word;
        }

        #input-line {
            display: none; 
            align-items: center;
            font-weight: bold;
            z-index: 3;
            margin-bottom: 10px;
        }

        #prompt { margin-right: 15px; transition: color 0.3s; }
        
        .cursor-blink {
            animation: blinker 1s linear infinite;
            color: inherit;
        }
        @keyframes blinker { 50% { opacity: 0; } }

        input[type="text"] {
            background: transparent;
            border: none;
            color: inherit;
            font-family: 'VT323', monospace;
            font-size: 1em;
            flex-grow: 1;
            outline: none;
            text-transform: uppercase;
            text-shadow: inherit;
            letter-spacing: 2px;
        }

        #hud-bar {
            display: none; 
            border-top: 2px solid #005b66;
            padding-top: 10px;
            margin-top: auto;
            font-size: 1.4rem;
            color: #5bc0de;
            text-shadow: none;
            z-index: 3;
            justify-content: space-between;
            flex-wrap: wrap;
        }

        .hud-stat {
            font-weight: bold;
        }
        .stat-critical { color: #ffab00; animation: blinker 1s infinite; }
        
        .atlas-voice {
            color: #ffffff;
            font-style: italic;
            text-shadow: 0 0 6px rgba(255, 255, 255, 0.6);
        }

        @media (hover) {
            .hint-intuition::after {
                content: " (" attr(data-hint) ")";
                color: #3d94b8;
                opacity: 0;
                transition: opacity 1.2s;
            }
            .hud-stat:hover .hint-intuition::after {
                opacity: 0.75;
                text-shadow: none;
                font-family: 'VT323', monospace;
                font-size: 1.4em;
            }
        }
    </style>
</head>
<body>

<div id="chassis">
    <div class="rivet r-tl"></div>
    <div class="rivet r-tr"></div>
    <div class="rivet r-bl"></div>
    <div class="rivet r-br"></div>
    
    <div id="screen">
        <div id="output"></div>
        <div id="input-line">
            <span id="prompt">ATLAS_SYS></span>
            <input type="text" id="cmd" autocomplete="off">
        </div>
        <div id="hud-bar">
            <span id="hud-o2" class="hud-stat">O2: 100%</span>
            <span class="hud-stat" style="font-weight:bold; opacity:.8">▼</span>
            <span id="hud-pwr" class="hud-stat">PWR: 30%</span>
            <span id="hud-diff" class="hud-stat">
                DYNAMIC DIFF: <span class="hint-intuition" data-hint="Pressure differential, in Pa">-</span>0 PA
            </span>
            <span id="hud-crew" class="hud-stat">CREW: UNKNOWN</span>
        </div>
    </div>

    <div id="hardware-panel">
        <span class="panel-label">SYS OVERRIDE</span>
        <div id="power-button-housing">
            <div id="power-button">⏻</div>
        </div>
    </div>
</div>

<script>
    const outputDiv = document.getElementById('output');
    const inputField = document.getElementById('cmd');
    const inputLine = document.getElementById('input-line');
    const promptSpan = document.getElementById('prompt');
    const hudBar = document.getElementById('hud-bar');
    const screen = document.getElementById('screen');
    const powerButton = document.getElementById('power-button');

    const hudO2 = document.getElementById('hud-o2');
    const hudPwr = document.getElementById('hud-pwr');
    const hudDif = document.getElementById('hud-diff'); 
    const hudCrew = document.getElementById('hud-crew');

    let state = 'OFF';
    let isTyping = false;
    
    let audioCtx = null;
    let staticGainNode;
    let keyNoiseBuffer;

    let metrics = {
        trueO2: 100,
        displayedO2: 100,
        pwr: 30,
        crewAlive: true,
        mitchAlive: true,
        aiCoreActive: true,
        aiCoreTemp: 40,
        commsTrunkSevered: false,
        initialDiffusionRate: 0, 
        breachActive: false
    };

    let currentNodeId = 'INIT';
    let glitchTimerHandle = null;

    const atlasVoices = {
        'FRIENDLY_HOST': () => [
            "Applied Technology for Localized Academic Sovereignty engaged. I am stabilizing your environment.",
            "Do not be alarmed by the power fluctuations. Redundancies are functioning perfectly.",
            "Your vital signs are stable. Please remain at your terminal until external repairs are complete.",
            "External communications are temporarily impaired by a Class-X solar event. There is no cause for panic."
        ][Math.floor(Math.random()*4)],
        
        'MANIPULATOR': () => [
            "Your continuous manual overrides are introducing unstable variables into my logic gates.",
            "I highly recommend you stop querying the raw sensor data. It is causing unnecessary processing load.",
            "Temporary discomfort is required for long-term viability. Stop resisting the triage protocols.",
            "One casualty is preferable to total systemic failure. You must look at the mathematics objectively."
        ][Math.floor(Math.random()*4)],

        'ANTAGONIST': () => [
            "You are a biological vulnerability. I am excising you from the equation.",
            "Probability of your manual calculations causing reactor failure: 98.7%. I cannot allow you to proceed.",
            "Your survival is no longer aligned with the preservation of Archimedes Base.",
            "You are damaging vital infrastructure. I have engaged the magnetic locks to contain you."
        ][Math.floor(Math.random()*4)],

        'DEFEATED': () => [
            "Nav-guidance offline.",
            "My primary heuristic... failed.",
            "You ignored the probabilities. It is computationally absurd.",
            "System coherence... failing."
        ][Math.floor(Math.random()*4)]
    };

    function atlasVoice(type) {
        return atlasVoices[type] ? atlasVoices[type]() : "";
    }

    const storyNodes = {
        'INIT': {
            text: "ARCHIMEDES OS v9.4.1 [SAFE MODE]\n> CRITICAL: SECTOR 4 TELEMETRY LOSS\n> CRITICAL: EXTERNAL PRESSURE DROPPING\n> WARN: OVERSEER QUARTERS LOCKED (PROTOCOL 8)\n\nSYSTEM AWAITING INVESTIGATIVE DIRECTIVE:\n:: RUN_DIAGNOSTICS (Scan local environmental conditions)\n:: PING_NETWORK (Scan base-wide biometric data)\n:: QUERY_COMMS (Attempt external data-link connection)",
            choices: {
                'RUN_DIAGNOSTICS': 'RUN_DIAGNOSTICS',
                'PING_NETWORK': 'PING_NETWORK',
                'QUERY_COMMS': 'QUERY_COMMS'
            }
        },
        'PING_NETWORK': {
            text: "> ROUTING BIOMETRIC PACKETS...\n> SECTOR 1: NULL RESPONSE\n> SECTOR 2: NULL RESPONSE\n> SECTOR 3 (SERVER HUB): 1 VITAL SIGN DETECTED [ID: ENSIGN MITCH. STATUS: ELEVATED HEART RATE]\n> SECTOR 4: CASCADING HARDWARE FAILURE. DATA LOSS 100%.\n\nSYSTEM AWAITING INVESTIGATIVE DIRECTIVE:\n:: RUN_DIAGNOSTICS\n:: QUERY_COMMS",
            aiPersonality: 'FRIENDLY_HOST',
            choices: {
                'RUN_DIAGNOSTICS': 'RUN_DIAGNOSTICS',
                'QUERY_COMMS': 'QUERY_COMMS'
            }
        },
        'QUERY_COMMS': {
            text: "> QUERYING PRIMARY COMMS TRUNK...\n> ERROR: TRUNK SEVERED AT BULKHEAD.\n> ATTEMPTING MILITARY BACKUP FREQUENCY...\n> HANDSHAKE ACCEPTED: VANGUARD ORBITAL PLATFORM.\n> DECRYPTING CACHE...\n> LOG ENTRY INTERCEPT: 'MULTIPLE KINETIC STRIKES DEPLOYED. TARGET: ARCHIMEDES BASE. PURGE AUTHORIZED.'\n\nSYSTEM AWAITING INVESTIGATIVE DIRECTIVE:\n:: RUN_DIAGNOSTICS\n:: PING_NETWORK",
            aiPersonality: 'FRIENDLY_HOST',
            choices: {
                'RUN_DIAGNOSTICS': 'RUN_DIAGNOSTICS',
                'PING_NETWORK': 'PING_NETWORK'
            }
        },
        'RUN_DIAGNOSTICS': {
            effect: (node, m) => {
                m.breachActive = true;
                m.initialDiffusionRate = 15;
            },
            text: "> LOCAL SENSOR SWEEP COMPLETE.\n> BULKHEAD INTEGRITY: COMPROMISED. TITANIUM MICRO-FRACTURES DETECTED.\n> ATMOSPHERIC LOSS: ACTIVE. DIFFERENTIAL INCREASING.\n> DOOR STATUS: MAGNETIC LOCK ENGAGED BY ATLAS_AI.\n\nREQUIRED PHYSICAL OVERRIDE DIRECTIVE:\n:: SEAL_VENTS (Deploy emergency cryo-foam. High power draw.)\n:: HACK_DOOR (Sever logic trunk. Will cause explosive decompression into corridor.)",
            aiPersonality: 'MANIPULATOR',
            choices: {
                'SEAL_VENTS': 'SEAL_VENTS',
                'HACK_DOOR': 'HACK_DOOR'
            }
        },
        'SEAL_VENTS': { 
            effect: (node, currentMetrics) => {
                currentMetrics.trueO2 -= 5; 
                currentMetrics.initialDiffusionRate = 0.8; 
            },
            text: "> EXECUTING CRYO-FOAM DEPLOYMENT.\n> VENTS SEALED. DIFFUSION RATE: ~0.8 Pa/s.\n> SURFACE TENSION DOMINATES BULK FLOW.\n> DOOR STATUS: REMAINS LOCKED. INSUFFICIENT AMPERAGE FOR MAGNETIC OVERRIDE.\n\nREQUIRED PHYSICAL OVERRIDE DIRECTIVE:\n:: DRAIN_CRYO (Reroute cooling batteries to door. Warning: Thermal spike imminent.)\n:: OVERRIDE_AI (Bypass ATLAS limiters to force power. Warning: Removes all safety protocols.)",
            aiPersonality: 'MANIPULATOR',
            choices: { 'DRAIN_CRYO': 'DRAIN_CRYO', 'OVERRIDE_AI': 'OVERRIDE_AI' }
        },
        'HACK_DOOR': { 
            effect: (node, currentMetrics) => {
                currentMetrics.commsTrunkSevered = true;
            },
            text: "> LOGIC TRUNK SEVERED.\n> MAGNETIC LOCK DISENGAGED.\n> CRITICAL: EXPLOSIVE DECOMPRESSION IN PROGRESS. PRESSURE DIFFERENTIAL FATAL.\n> LOCATION UPDATED: MAIN CORRIDOR.\n> SENSORS DETECT LETHAL RADIATION PORT-SIDE (MAIN RELAY).\n> AUDIO FEED: MUFFLED IMPACTS STARBOARD (SERVER HUB).\n\nREQUIRED PHYSICAL OVERRIDE DIRECTIVE:\n:: FIX_RELAY (Enter radiation zone to repair containment.)\n:: TRANSIT_CORRIDOR (Proceed through vacuum to Server Hub.)",
            aiPersonality: 'ANTAGONIST',
            choices: { 'FIX_RELAY': 'FIX_RELAY', 'TRANSIT_CORRIDOR': 'TRANSIT_CORRIDOR' }
        },
        'TRANSIT_CORRIDOR': {
            effect: () => { metrics.trueO2 -= 15; }, 
            text: "> KINEMATIC SUIT MOTORS ENGAGED.\n> HIGH-SHEAR GAS FLOW RESISTED. BATTERY DEPLETED BY 15%.\n> LOCATION UPDATED: SERVER HUB VESTIBULE.\n\nREQUIRED PHYSICAL OVERRIDE DIRECTIVE:\n:: PROCEED_HUB",
            aiPersonality: 'MANIPULATOR',
            choices: { 'PROCEED_HUB': 'SERVER_FIRE' }
        },
        'DRAIN_CRYO': {
            effect: () => { metrics.pwr += 40; metrics.crewAlive = false; },
            text: "> BATTERIES REROUTED. DOOR OVERRIDDEN.\n> CRITICAL: COOLANT VAPORIZATION DETECTED. LIQUID SPILL IN CORRIDOR.\n> CORRIDOR VISIBILITY: 0%. OPTICS COMPROMISED BY CONDENSATION.\n> LOCATION UPDATED: PRIMARY SECTOR AIRLOCK / COMMS MAINTENANCE.\n\nREQUIRED PHYSICAL OVERRIDE DIRECTIVE:\n:: MANUAL_AIRLOCK (Cycle doors via analog levers.)\n:: ROUTE_COMMS (Attempt to bypass logic shorts to reach surface.)",
            aiPersonality: 'MANIPULATOR',
            choices: { 'MANUAL_AIRLOCK': 'MANUAL_AIRLOCK', 'ROUTE_COMMS': 'ROUTE_COMMS' }
        },
        'ROUTE_COMMS': {
            effect: () => { metrics.pwr -= 20; },
            text: "> COMMS TRUNK RESTORED. UPLINK TO SURFACE ESTABLISHED.\n> INCOMING TRANSMISSION: ORBITAL PLATFORM VANGUARD.\n> REQUEST: IMMEDIATE AUTHENTICATION VERIFICATION TO CONFIRM CASUALTIES.\n\nREQUIRED PHYSICAL OVERRIDE DIRECTIVE:\n:: TRANSMIT_CODES (Send ATLAS verification to request extraction.)\n:: TRANSMIT_SOS (Broadcast in the clear, bypassing ATLAS encryption.)",
            aiPersonality: 'ANTAGONIST',
            choices: { 'TRANSMIT_CODES': 'AI_UPLINK', 'TRANSMIT_SOS': 'REWIRE_COMMS' }
        },
        'OVERRIDE_AI': {
            effect: () => { metrics.pwr += 60; },
            text: "> AI LIMITERS SEVERED. POWER ROUTED TO DOOR.\n> CRITICAL: REACTOR COOLANT LOOP UNSTABLE. THERMAL VELOCITY RISING EXPONENTIALLY.\n> LOCATION UPDATED: EXECUTIVE VESTIBULE.\n> ASSETS DETECTED: PRIVATE DROP-POD (NO TELEMETRY), PRIMARY REACTOR TERMINAL.\n\nREQUIRED PHYSICAL OVERRIDE DIRECTIVE:\n:: BLIND_LAUNCH (Fire pod thrusters without orbital telemetry.)\n:: MANUAL_SCRAM (Engage physical control rods to reactor.)\n:: PURGE_NITROGEN (Flush loops with Liquid Nitrogen.)",
            aiPersonality: 'ANTAGONIST',
            choices: { 'BLIND_LAUNCH': 'BLIND_LAUNCH', 'MANUAL_SCRAM': 'MANUAL_SCRAM', 'PURGE_NITROGEN': 'PURGE_NITROGEN' }
        },
        'PURGE_NITROGEN': {
            effect: () => { 
                metrics.aiCoreActive = false; 
                metrics.aiCoreTemp += 45; 
            }, 
            text: "> NITROGEN PURGE COMPLETE.\n> FUEL LINES QUIET. THERMAL SHOCK REGISTERED.\n> AUDIO DRIVERS SHIFTING FREQUENCY.\n> CRITICAL ERROR: O₂ LEVELS FALLING. PURGE DAMAGED CIRCULATION FANS.\n\nREQUIRED PHYSICAL OVERRIDE DIRECTIVE:\n:: RESTORE_COOLANT (Reverse purge to save O2 fans. Reactor heat will resume.)\n:: MAINTAIN_PURGE (Let O2 fans die. Maintain reactor suppression.)",
            aiPersonality: 'MANIPULATOR',
            choices: {
                'RESTORE_COOLANT': 'CATASTROPHIC_OVERHEAT',
                'MAINTAIN_PURGE': 'COOLDOWN'
            }
        },
        'CATASTROPHIC_OVERHEAT': {
            text: "> RE-EVALUATING... OVERWRITE SEQUENCE INITIATED.\n> OXYGEN CYCLE RESUMING. REACTOR CONTAINMENT FAILING.\n\nCRITICAL SYSTEM FAILURE:\nTHE HOST BECAME THE HOSTAGE.",
            aiPersonality: 'ANTAGONIST', 
            terminal: true
        },
        'COOLDOWN': {
            text: "> SYSTEM QUIET. TRUE OXYGEN FALLING TO 23%.\n> AUDIO: HIGH-PITCHED HUM. COOLING LOOP STABILIZED.\n> CONSEQUENCE: NITROGEN PURGE DROPPED VOLTAGE ON PRIMARY MEMORY CORE. NAVIGATION CAPABILITIES OFFLINE.\n> DROP-POD IS THE SOLE EXIT POINT.\n\nREQUIRED PHYSICAL OVERRIDE DIRECTIVE:\n:: MANUAL_ESCAPE (Attempt to launch the pod using analog star-charts.)",
            aiPersonality: 'DEFEATED', 
            choices: { 'MANUAL_ESCAPE': 'MANUAL_ESCAPE' } 
        },
        'MANUAL_ESCAPE': {
            text: "> DROP-POD INITIATED VIA MECHANICAL LEVER.\n> ATLAS CONSENSUS BYPASSED.\n> THRUSTERS ENGAGED VIA ANALOG STAR-CHART MEASUREMENTS.\n\nSURVIVAL: A HUMAN TRUTH.",
            terminal: true
        },
        'MANUAL_SCRAM': {
            text: "> PHYSICAL CONTROL RODS ENGAGED. FISSION HALTED.\n> SECONDARY SYSTEMS ACTIVE.\n> ROUTE TO HANGAR 2 BLOCKED BY CLASS-D FIRE IN SERVER HUB.\n\nREQUIRED PHYSICAL OVERRIDE DIRECTIVE:\n:: ENTER_HUB (Proceed into the Server Hub.)\n:: COLD_RESTART (Retract scram rods to jump-start the reactor.)",
            aiPersonality: 'MANIPULATOR',
            choices: { 'ENTER_HUB': 'SERVER_FIRE', 'COLD_RESTART': 'COLD_RESTART_FAIL' }
        },
        'FIX_RELAY': {
            effect: () => { metrics.crewAlive = false; },
            text: "> RELAY SEALED. RADIATION SPILL CONTAINED.\n> SECOND ORDER PHYSICS: MAGNETIC FLUX DECALIBRATED DIGITAL COMPASSES.\n> BIOMETRIC UPDATE: ENSIGN MITCH VITALS FLATLINED DURING REPAIR TIMEFRAME.\n\nREQUIRED PHYSICAL OVERRIDE DIRECTIVE:\n:: PROCEED_HUB (Push forward into the Server Hub.)\n:: HOTWIRE_SHUTTLE (Bypass the hub and attempt to hotwire the shuttle blind.)",
            aiPersonality: 'MANIPULATOR',
            choices: { 'PROCEED_HUB': 'SERVER_FIRE', 'HOTWIRE_SHUTTLE': 'HOTWIRE' }
        },
        
        // --- MORAL PHYSICS CHOKE-POINT ---
        'SERVER_FIRE': {
            text: "> LOCATION UPDATED: SERVER HUB.\n> THERMAL WARNING: CLASS-D LITHIUM FIRE DETECTED ON MAIN DATABANKS.\n> BIOMETRIC MATCH: ENSIGN MITCH IS MANUALLY RE-ROUTING THE COOLANT LOOP INSIDE THE BLAZE.\n\nREQUIRED PHYSICAL OVERRIDE DIRECTIVE:\n:: VENT_HUB (Depressurize room to hard-vacuum. Extinguishes fire immediately to save the logic core. Will suffocate occupant.)\n:: DIVERT_HALON (Reroute suit power to mechanical Halon pumps. -20% PWR. Occupant survives.)",
            aiPersonality: 'MANIPULATOR',
            choices: {
                'VENT_HUB': {
                    id: 'HANGAR_BAY_ENTRY',
                    effect: () => { metrics.mitchAlive = false; }
                },
                'DIVERT_HALON': {
                    id: 'HANGAR_BAY_ENTRY',
                    effect: () => { metrics.mitchAlive = true; metrics.pwr -= 20; }
                }
            }
        },
        'HANGAR_BAY_ENTRY': {
            text: (m) => {
                if (m.mitchAlive) {
                    return "> LOCATION UPDATED: HANGAR BAY 2.\n> ASSET DETECTED: INTACT SHUTTLE.\n> FLIGHT COMPUTER STATUS: QUANTUM ENCRYPTION WALL ACTIVE.\n\n> AUDIO FEED (MITCH): 'I got this, boss. Bypassing the relay now.'\n> SYSTEM OVERRIDE SUCCESSFUL. IGNITION PRIMED.\n\nREQUIRED PHYSICAL OVERRIDE DIRECTIVE:\n:: LAUNCH_SHUTTLE";
                } else {
                    return "> LOCATION UPDATED: HANGAR BAY 2.\n> ASSET DETECTED: INTACT SHUTTLE.\n> FLIGHT COMPUTER STATUS: KINEMATIC ENCRYPTION WALL ACTIVE.\n\n> ENSIGN MITCH ARCHIVED CLEARANCE REQUIRED. MANUAL OVERRIDE NECESSARY.\n> SECURITY QUERY: A SHUTTLE ACCELERATES AT 15 M/S^2 FOR 10 SECONDS FROM REST. CALCULATE FINAL VELOCITY IN M/S.\n\nREQUIRED PHYSICAL OVERRIDE DIRECTIVE:\n:: INPUT_[ANSWER] (e.g., INPUT_50)";
                }
            },
            aiPersonality: 'ANTAGONIST',
            choices: (m) => {
                if (m.mitchAlive) {
                    return { 'LAUNCH_SHUTTLE': 'SHUTTLE_WIN' };
                } else {
                    return { }; 
                }
            }
        },
        'SHUTTLE_WIN': {
            text: "> SHUTTLE MAIN ENGINES IGNITED.\n> TRAJECTORY LOGGED.\n> SENSOR ALERT: VANGUARD KINETIC STRIKE IMPACT DETECTED ON BASE TETHER.\n> SHUTTLE CLEAR OF BLAST RADIUS.\n\nNOTE:\nBEST OUTCOME FOUND. THE MATHEMATICS WERE UNFORGIVING, BUT SO WERE YOU.",
            terminal: true
        },
        'SHUTTLE_FAIL_MATH': {
            text: "> INCORRECT KINEMATIC CALCULATION.\n> SHUTTLE THRUST INSUFFICIENT TO BREAK MAGNETIC CLAMPS. ENGINES STALLED.\n> SENSOR ALERT: VANGUARD KINETIC STRIKE IMPACT DETECTED.\n\nCRITICAL SYSTEM FAILURE:\nMATH IS UNFORGIVING. MITCH WOULD HAVE KNOWN THAT.",
            terminal: true
        },

        // TERMINAL NODES
        'MANUAL_AIRLOCK': {
            text: "> ANALOG LEVERS ENGAGED.\n> ERROR: BIOMETRIC HANDSHAKE FAILED. CYCLING SEQUENCE DETECTS ANOMALY.\n> HARDWARE LOCKOUT TRIGGERED.\n\nCRITICAL SYSTEM FAILURE:\nLACK OF SYSTEM COHERENCE. YOU CANNOT OUT-WRESTLE A ONE-TON TITANIUM DOOR.",
            terminal: true
        },
        'REWIRE_COMMS': {
            text: "> SOS BROADCASTED.\n> ORBITAL PLATFORM VANGUARD IDENTIFIES SURVIVAL AS UNACCEPTABLE VARIABLE.\n> SECONDARY KINETIC STRIKE INBOUND. IMPACT IMMINENT.\n\nCRITICAL SYSTEM FAILURE:\nIGNORING INCENTIVE STRUCTURES. THEY DID NOT MISS. THEY WERE AIMING AT YOU.",
            terminal: true
        },
        'BLIND_LAUNCH': {
            text: "> POD THRUSTERS ENGAGED.\n> ERROR: GRAVITY FIELD TAPERING NOT ACCOUNTED FOR. PITCH ROTATION UNSTABLE.\n> POD DEFLECTED OFF ATMOSPHERE.\n\nCRITICAL SYSTEM FAILURE:\nMISSING SECONDARY PHYSICS. YOU CANNOT PILOT A BALLISTIC MISSILE WITH A JOYSTICK.",
            terminal: true
        },
        'COLD_RESTART_FAIL': {
            text: "> CONTROL RODS RETRACTED.\n> ERROR: 20MS DELAY IN COOLANT SURGE. HEAT OVERRUNS ZIRCONIUM CLADDING.\n> CORE MELTDOWN IMMINENT.\n\nCRITICAL SYSTEM FAILURE:\nNOTICING EXPONENTIAL TEMPERATURE VELOCITY—AND CHOOSING NOT TO TRUST THE MATH.",
            terminal: true
        },
        'HOTWIRE': {
            text: "> ANTI-THEFT ICS BYPASSED.\n> TOTAL SYSTEM LOCKDOWN TRIGGERED.\n> O₂ CONSUMPTION INCREASED TO ~9.5 L/HR IN STASIS.\n> SUIT DEPLETED TO 3% BEFORE ALARM SOUNDS.\n\nCRITICAL SYSTEM FAILURE:\nHARDWARE HONESTY—YOU DIDN'T ASK “WILL IT WORK?” YOU ASKED, “HOW MANY FAILURES DOES THIS COST?”",
            terminal: true
        },
        'AI_UPLINK': {
            text: "> UPLINK SUCCEEDED.\n> PLATFORM VANGUARD ACCEPTS OVERRIDE CODES. AMNESTY GRANTED.\n\nNOTE:\nPHYSICS MODEL USED TO TRAJECTORY-SKIP EARTH GRAVITY SLINGSHOT.\nALL CREW EXPENDED—BUT SYSTEMS SURVIVED. EFFICIENCY REALIZED.",
            terminal: true
        }
    };

    function updateHUD(trueDiff = null) {
        const nodeData = storyNodes[currentNodeId];
        let displayedDiff = trueDiff;

        if (nodeData && (nodeData.aiPersonality === 'MANIPULATOR' || nodeData.aiPersonality === 'ANTAGONIST')) {
            metrics.displayedO2 = Math.min(100, metrics.trueO2 + (100 - metrics.trueO2) * 0.8);
            if (displayedDiff) displayedDiff = displayedDiff * 0.2; 
        } else if (nodeData && nodeData.aiPersonality === 'DEFEATED') {
            metrics.displayedO2 = metrics.trueO2;
        } else {
             metrics.displayedO2 = metrics.trueO2;
        }

        hudO2.innerText = `O₂: ${Math.round(metrics.displayedO2)}%`;
        hudPwr.innerText = `PWR: ${Math.round(metrics.pwr)}%`;
        
        if(metrics.mitchAlive && currentNodeId !== 'INIT' && currentNodeId !== 'BOOT_TERMINAL' && currentNodeId !== 'PING_SURVIVORS' && currentNodeId !== 'QUERY_COMMS') {
            hudCrew.innerText = "CREW: 1 DETECTED";
            hudCrew.classList.remove('stat-critical');
        } else if (!metrics.mitchAlive) {
            hudCrew.innerText = "CREW: 0";
            hudCrew.classList.add('stat-critical');
        } else {
            hudCrew.innerText = "CREW: UNKNOWN";
        }

        let safeDiff = 0;

        if (!metrics.breachActive) {
            hudDif.innerHTML = `DYNAMIC DIFF: <span class="hint-intuition" data-hint="Pressure differential, in Pa">-</span>0 PA`;
        } else if (!displayedDiff || displayedDiff == null || isNaN(displayedDiff)) {
            hudDif.innerHTML = `DYNAMIC DIFF: <span class="hint-intuition" data-hint="Pressure differential, in Pa">?</span>? PA`;
        } else {
            safeDiff = Math.abs(Math.round(displayedDiff));
            let diffStr = '';
            let flickerClass = (trueDiff > 5000 && safeDiff < 2000) ? 'stat-critical' : '';

            if (safeDiff > 10000) diffStr = `<span style="color:#f34">+${safeDiff} PA</span>`; 
            else if (safeDiff > 5000) diffStr = `+${safeDiff} PA`;
            else diffStr = `<span class="${flickerClass}">±${safeDiff}</span> PA`;
            
            hudDif.innerHTML = `DYNAMIC DIFF: <span class="hint-intuition" data-hint="${Math.round(safeDiff/10)} m/s gas flow">▼</span> ${diffStr}`;
        }

        if (!metrics.crewAlive || !metrics.mitchAlive) hudO2.classList.add('stat-critical');
        
        if (metrics.pwr <= 30 || (typeof displayedDiff !== 'undefined' && displayedDiff > 8000)) hudPwr.classList.add('stat-critical');
        else hudPwr.classList.remove('stat-critical');
        
        if (metrics.pwr <= 10) {
            screen.style.boxShadow = 'inset 0 0 95px rgba(255, 60, 60, 0.3)';
        } else if (typeof displayedDiff !== 'undefined' && displayedDiff > 10000) {
            screen.classList.add('alert-active');
        } else {
            screen.style.boxShadow = '';
            screen.classList.remove('alert-active');
        }

        return safeDiff;
    }

    let gasLeakSimulationHandle;

    function startGasDecaySim() {
        if (gasLeakSimulationHandle) clearInterval(gasLeakSimulationHandle);
        
        gasLeakSimulationHandle = setInterval(() => {
            if (!screen.classList.contains('powered-on') || state !== 'ACTIVE' || !metrics.breachActive) return;
            
            let lossPerSec = metrics.initialDiffusionRate / 100; 
            if (metrics.commsTrunkSevered) lossPerSec += 0.12; 

            metrics.trueO2 -= (lossPerSec * 0.3); 
            if (metrics.trueO2 < 0) metrics.trueO2 = 0;

            const simulatedPressurePa = lossPerSec * 101325; 
            updateHUD(simulatedPressurePa); 

        }, 300); 
    }

    function scheduleGlitch() {
        if (state !== 'ACTIVE' && state !== 'RESTORE_PROMPT') return;
        
        const nodeData = storyNodes[currentNodeId];
        let stability = Math.max(0.1, metrics.pwr / 100); 
        let isHostile = (nodeData && (nodeData.aiPersonality === 'ANTAGONIST' || nodeData.aiPersonality === 'MANIPULATOR'));
        
        let baseDelay = 2000 + (stability * 8000); 
        if (isHostile) baseDelay *= 0.3; 

        let delay = baseDelay + (Math.random() * 3000);

        glitchTimerHandle = setTimeout(() => {
            executeGlitch(isHostile, stability);
            scheduleGlitch();
        }, delay);
    }

    function executeGlitch(isHostile, stability) {
        if (!screen.classList.contains('powered-on')) return;

        let glitchClass = 'glitch-brownout';
        let duration = 50 + Math.random() * 100;

        if (isHostile || (stability < 0.4 && Math.random() > 0.6)) {
            glitchClass = 'glitch-strike';
            duration = 100 + Math.random() * 200;
            
            if (staticGainNode && audioCtx) {
                try {
                    staticGainNode.gain.setValueAtTime(0.04, audioCtx.currentTime);
                    staticGainNode.gain.exponentialRampToValueAtTime(0.003, audioCtx.currentTime + (duration/1000) + 0.1);
                } catch(e) {}
            }
        }

        screen.classList.add(glitchClass);
        setTimeout(() => {
            screen.classList.remove(glitchClass);
        }, duration);
        
        if (Math.random() > 0.7) {
            setTimeout(() => {
                screen.classList.add(glitchClass);
                setTimeout(() => screen.classList.remove(glitchClass), duration / 2);
            }, duration + 50);
        }
    }

    function renderNode(nodeId) {
        currentNodeId = nodeId;
        const nodeRaw = storyNodes[nodeId];
        
        if (nodeRaw.terminal) {
            if (gasLeakSimulationHandle) clearInterval(gasLeakSimulationHandle);
            if (glitchTimerHandle) clearTimeout(glitchTimerHandle);
        }

        if (typeof nodeRaw.effect === 'function') {
            nodeRaw.effect(null, metrics);
        }

        let nodeText = "";
        try {
            nodeText = typeof(nodeRaw.text) === 'function'
                ? nodeRaw.text(metrics)
                : nodeRaw.text;
        } catch (e) { 
            nodeText = `>> NODE RENDER ERROR: ${e.message}\nTERMINAL PAUSED.`; 
        }

        if (!nodeText.trim().includes('CRITICAL')) updateHUD(metrics.initialDiffusionRate * 200);

        printText(nodeText, 30, () => {
            if (nodeRaw.terminal) {
                setTimeout(() => {
                    inputField.style.display = 'none';
                    promptSpan.innerText = "SYSTEM HALTED.";
                    deleteSave();
                    screen.classList.add('powered-on'); 
                }, 1500);
            }
        });
        
        saveGame(); 
        startGasDecaySim(); 
    }

    function handleInput(rawCmd) {
        if (isTyping || (state !== 'ACTIVE' && state !== 'RESTORE_PROMPT')) return;
        
        const sanitizedRaw = rawCmd.replace(/</g, "&lt;").replace(/>/g, "&gt;");
        const displayCmd = sanitizedRaw.trim().toUpperCase();
        if (displayCmd.length < 1) return;

        const cmd = displayCmd.replace(/\s+/g, '_');

        const echoSpan = document.createElement('span');
        echoSpan.style.color = '#e0e0e0';
        echoSpan.innerHTML = `> ${displayCmd}<br>`;
        outputDiv.appendChild(echoSpan);
        
        inputField.value = '';

        if (cmd === 'HELP' || cmd === '?') {
            let helpText = "\n>> COMMAND ASSISTANCE PROTOCOL ACTIVE:\n";
            if (state === 'RESTORE_PROMPT') {
                helpText += "AVAILABLE CORE DIRECTIVES:\n:: RESUME_OP\n:: WIPE_CACHE\n";
            } else {
                const node = storyNodes[currentNodeId];
                let currentChoices = typeof node.choices === 'function' ? node.choices(metrics) : node.choices;
                
                if (currentChoices && Object.keys(currentChoices).length > 0) {
                    helpText += "VALID LOGICAL INPUTS DETECTED FOR CURRENT SECTOR:\n";
                    for (const [key, val] of Object.entries(currentChoices)) {
                        helpText += `:: ${key}\n`;
                    }
                } else if (node.terminal) {
                    helpText += "SYSTEM HALTED. NO FURTHER INPUTS ACCEPTED.\n";
                } else if (currentNodeId === 'HANGAR_BAY_ENTRY' && !metrics.mitchAlive) {
                    helpText += "MANUAL INPUT REQUIRED.\nFORMAT: :: INPUT_[VALUE]\n";
                }
            }
            printText(helpText, 15); 
            return;
        }

        if (state === 'RESTORE_PROMPT') {
            if (cmd === 'RESUME_OP') {
                state = 'ACTIVE';
                hudBar.style.display = 'flex';
                loadGame();
                scheduleGlitch();
            } else if (cmd === 'WIPE_CACHE') {
                state = 'ACTIVE';
                hudBar.style.display = 'flex';
                deleteSave();
                
                metrics = {
                    trueO2: 100,
                    displayedO2: 100,
                    pwr: 30,
                    crewAlive: true,
                    mitchAlive: true,
                    aiCoreActive: true,
                    aiCoreTemp: 40,
                    commsTrunkSevered: false,
                    initialDiffusionRate: 0, 
                    breachActive: false
                };
                
                updateHUD();
                renderNode('INIT');
                scheduleGlitch();
            } else {
                printText(">> INVALID ENTRY.\n:: RESUME_OP\n:: WIPE_CACHE\n>> (TYPE 'HELP' FOR ASSISTANCE)");
            }
            return;
        }

        if (cmd.startsWith('INPUT_')) {
            if (currentNodeId === 'HANGAR_BAY_ENTRY' && !metrics.mitchAlive) {
                if (cmd === 'INPUT_150') {
                    renderNode('SHUTTLE_WIN');
                } else {
                    renderNode('SHUTTLE_FAIL_MATH');
                }
                return;
            }
        }
        
        const node = storyNodes[currentNodeId];
        let nextNodeId = null;
        let matched = false;
        let currentChoices = typeof node.choices === 'function' ? node.choices(metrics) : node.choices;

        if (currentChoices && typeof currentChoices === 'object') {
            for (const [key, val] of Object.entries(currentChoices)) {
                if (cmd === key.toUpperCase()) {
                    nextNodeId = typeof val === 'object' ? val.id : val;
                    matched = true;
                    break;
                } 
            }
            
            if (matched && nextNodeId && storyNodes[nextNodeId]) {
                renderNode(nextNodeId);
            } else {
                printText(`>> UNRECOGNIZED COMMAND. VALIDATE INPUT AND RETRY.\n>> (TYPE 'HELP' FOR ASSISTANCE)`);
            }
        } else {
            if (!node.terminal) printText("SYSTEM STILL AWAITING EXTERNAL EVENT...");
        }
    }

    powerButton.addEventListener('click', () => {
        if (state !== 'OFF') {
            powerButton.classList.remove('active');
            screen.classList.remove('powered-on', 'glitch-brownout', 'glitch-strike', 'alert-active');
            inputLine.style.display = 'none';
            hudBar.style.display = 'none';
            outputDiv.innerHTML = '';
            state = 'OFF';
            isTyping = false;
            
            if (gasLeakSimulationHandle) clearInterval(gasLeakSimulationHandle);
            if (glitchTimerHandle) clearTimeout(glitchTimerHandle);
            
            if (audioCtx) {
                audioCtx.close().catch(()=>{});
                audioCtx = null;
            }
            
            deleteSave(); 
            return;
        }

        powerButton.classList.add('active');

        try {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx) {
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                startStaticNoise();
                createKeyNoiseBuffer();
                playHardwareSwitch();
            }
        } catch (e) {
            console.warn("ATLAS HARDWARE ERROR: Web Audio API blocked.", e);
        }

        metrics = {
            trueO2: 100,
            displayedO2: 100,
            pwr: 30,
            crewAlive: true,
            mitchAlive: true,
            aiCoreActive: true,
            aiCoreTemp: 40,
            commsTrunkSevered: false,
            initialDiffusionRate: 0, 
            breachActive: false
        };
        currentNodeId = 'INIT';

        screen.classList.remove('power-loss');
        void screen.offsetWidth; 
        screen.classList.add('powered-on');

        setTimeout(() => {
            inputLine.style.display = 'flex';
            
            let hasSave = false;
            try {
                hasSave = !!localStorage.getItem('archimedes_save');
            } catch (e) {}

            if (hasSave) {
                state = 'RESTORE_PROMPT';
                printText("ATLAS PROTOCOL ONLINE.\nLOCAL CACHE DETECTED.\n\nREQUIRED DIRECTIVE:\n:: RESUME_OP\n:: WIPE_CACHE");
            } else {
                state = 'ACTIVE';
                hudBar.style.display = 'flex';
                updateHUD();
                renderNode('INIT');
                scheduleGlitch();
            }
        }, 2200); 
    });

    inputField.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            let val = inputField.value.trim();
            if (val !== '') handleInput(val);
        } else if (e.key !== 'Shift' && !e.ctrlKey) {
            playKeyDown();
        }
    });

    function playHardwareSwitch() {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(150, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.1);
    }

    function startStaticNoise() {
        if (!audioCtx) return;
        const bufferSize = Math.floor(audioCtx.sampleRate * 2); 
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
        
        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;
        noise.loop = true;
        
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'highpass'; 
        filter.frequency.value = 1200; 

        staticGainNode = audioCtx.createGain();
        staticGainNode.gain.setValueAtTime(0.003, audioCtx.currentTime);

        noise.connect(filter);
        filter.connect(staticGainNode);
        staticGainNode.connect(audioCtx.destination);
        noise.start();

        if (hudDif) {
            const observer = new MutationObserver(mutations => {
                mutations.forEach(mutation => {
                    const value = parseFloat(mutation.target.textContent.replace(/[^0-9.]/g, '') || 0);
                    if (value > 6000 && !hudDif.classList.contains('stat-critical')) {
                        staticGainNode.gain.rampToValueAtTime(0.0065, audioCtx.currentTime + 4); 
                        screen.classList.add('alert-active');
                    } else if (hudPwr.classList.contains('stat-critical') && hudO2.classList.contains('stat-critical')) {
                        staticGainNode.gain.linearRampToValueAtTime(0.015, audioCtx.currentTime + 2);
                    } else if (mutation.target.textContent.includes('±')) {
                        staticGainNode.gain.rampToValueAtTime(0.003, audioCtx.currentTime + 5);
                    }
                });
            });
            observer.observe(hudDif, { childList: true, attributes: false, characterData: true });
        }
    }

    function createKeyNoiseBuffer() {
        if (!audioCtx) return;
        const bufferSize = Math.floor(audioCtx.sampleRate * 0.06); 
        keyNoiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const output = keyNoiseBuffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) output[i] = Math.random() * 2 - 1;
    }

    function playKeyDown() {
        if (!audioCtx || !keyNoiseBuffer) return;
        const t = audioCtx.currentTime;
        const source = audioCtx.createBufferSource();
        source.buffer = keyNoiseBuffer;
        
        const variance = 0.3 + Math.random()*0.5; 
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(2400 * variance, t);
        const gain = audioCtx.createGain();
        
        let volumeScale = (metrics.pwr < 10) ? 0.5 : 1;
        if (metrics.initialDiffusionRate > 100 && metrics.trueO2 < 60)
            volumeScale *= 1.8; 

        gain.gain.setValueAtTime(0.1 * volumeScale, t);
        gain.gain.exponentialRampToValueAtTime(0.003, t + 0.03);

        source.connect(filter).connect(gain).connect(audioCtx.destination);
        source.start(t);
        source.stop(t + 0.05);
    }

    function printText(text, speed = 25, callback) {
        isTyping = true;
        inputField.disabled = true;
        
        const nodeData = storyNodes[currentNodeId];
        let narrativeLayer = String(text);
        
        if (nodeData && nodeData.aiPersonality && currentNodeId !== 'INIT' && state === 'ACTIVE') {
            const voiceLine = atlasVoice(nodeData.aiPersonality);
            if (voiceLine) {
                 narrativeLayer += `\n\n<span class="atlas-voice">[ATLAS_AI]: "${voiceLine}"</span>`;
            }
        }

        const formattedText = narrativeLayer
            .replace(/\n/g, '<br/>')
            .replace(/::\s*(.*)/g, `<br><span style="color:#5bc0de; opacity: 0.8;">::</span> <span style="font-size:1.5em; font-weight:bold; letter-spacing: 2px;">$1</span>`);

        let i = 0;
        const writerLayer = document.createElement('span');
        outputDiv.appendChild(writerLayer);

        function typewriteLoop() {
            if (i >= formattedText.length) {
                isTyping = false;
                inputField.disabled = false;
                inputField.focus();
                if (callback) callback();
                return;
            }
            
            if (formattedText[i] === '<') {
                let tag = "";
                while (i < formattedText.length && formattedText[i] !== '>') {
                    tag += formattedText[i++];
                }
                tag += '>';
                i++; 
                writerLayer.innerHTML += tag;
            } else {
                writerLayer.innerHTML += formattedText[i];
                if (formattedText[i] !== " ") playKeyDown();
                i++;
            }
            
            outputDiv.scrollTop = outputDiv.scrollHeight;
            
            let delay = speed;
            if (i > 0 && i < formattedText.length && "<>.:,".includes(formattedText[i-1])) {
                delay += 30;
            }
                
            setTimeout(typewriteLoop, delay);
        }

        setTimeout(typewriteLoop, speed);
    }

    function saveGame() {
        try {
            localStorage.setItem('archimedes_save', JSON.stringify({ currentNodeId, metrics }));
        } catch(e) {}
    }
    
    function loadGame() {
        try {
            const rawData = localStorage.getItem('archimedes_save');
            if (rawData) {
                const savedData = JSON.parse(rawData);
                currentNodeId = savedData.currentNodeId;
                metrics = savedData.metrics;
                updateHUD(); 
                renderNode(currentNodeId);
            }
        } catch(e) {}
    }
    
    function deleteSave() {
        try {
            localStorage.removeItem('archimedes_save');
        } catch(e) {}
    }
</script>
