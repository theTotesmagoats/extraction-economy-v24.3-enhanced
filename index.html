<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Terminal Mk V - Archimedes Base</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #010409;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'VT323', monospace;
            overflow: hidden;
            user-select: none;
        }

        #chassis {
            background-color: #111418;
            width: 96vw;
            height: 96vh;
            padding: 40px 40px 80px 40px; 
            border-radius: 12px;
            box-sizing: border-box;
            box-shadow: inset 0 0 30px #000, 0 0 50px rgba(0,229,255,0.05);
            border: 8px solid #080a0c;
            position: relative;
            display: flex;
            flex-direction: column;
            transition: transform 0.05s, border-color 0.3s;
        }

        .rivet {
            position: absolute;
            width: 14px;
            height: 14px;
            background: #222;
            border-radius: 50%;
            box-shadow: inset 2px 2px 4px #444, inset -2px -2px 4px #000;
        }
        .r-tl { top: 12px; left: 12px; }
        .r-tr { top: 12px; right: 12px; }
        .r-bl { bottom: 12px; left: 12px; }
        .r-br { bottom: 12px; right: 12px; }

        #hardware-panel {
            position: absolute;
            bottom: 15px;
            right: 40px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .panel-label {
            color: #4a6b7c;
            font-family: sans-serif;
            font-size: 0.8rem;
            font-weight: bold;
            letter-spacing: 2px;
            text-shadow: -1px -1px 1px #000;
        }

        #power-button-housing {
            width: 50px;
            height: 50px;
            background: #080a0c;
            border-radius: 50%;
            box-shadow: 0 0 10px #000, inset 2px 2px 5px #1a2229, inset -2px -2px 5px #000;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #power-button {
            width: 36px;
            height: 36px;
            background: #102a3a; 
            border-radius: 50%;
            box-shadow: inset 2px 2px 4px #1c4966, inset -2px -2px 4px #050d12, 2px 2px 5px rgba(0,0,0,0.8);
            color: #0a1b26; 
            font-family: sans-serif;
            font-size: 18px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.1s;
        }

        #power-button.active {
            box-shadow: inset 2px 2px 6px #050d12, inset -2px -2px 6px #1c4966, 0 0 2px #000;
            transform: scale(0.95);
            color: #00e5ff;
            text-shadow: 0 0 5px #00e5ff;
        }

        #screen {
            background: #010812;
            width: 100%;
            height: 100%;
            border-radius: 4px; 
            padding: 35px;
            box-sizing: border-box;
            box-shadow: inset 0 0 80px rgba(0,0,0,1), 0 0 10px rgba(0,229,255,0.05);
            border: 4px solid #031424;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            color: #00e5ff; 
            text-shadow: 0 0 3px #00e5ff, 0 0 8px rgba(0, 229, 255, 0.4); 
            font-size: 1.8rem;
            letter-spacing: 1.5px;
            animation: flicker 0.15s infinite;
            
            opacity: 0;
            transition: opacity 1.5s ease-in;
        }

        #screen.powered-on {
            opacity: 1;
        }

        @keyframes alertPulse {
            0% { box-shadow: inset 0 0 80px rgba(0,0,0,1); border-color: #031424; }
            50% { box-shadow: inset 0 0 120px rgba(255, 171, 0, 0.2); border-color: #ffab00; }
            100% { box-shadow: inset 0 0 80px rgba(0,0,0,1); border-color: #031424; }
        }
        .alert-active {
            animation: alertPulse 1.5s infinite !important;
            color: #ffab00 !important;
            text-shadow: 0 0 4px #ffab00 !important;
        }

        @keyframes flicker {
            0% { opacity: 0.98; }
            50% { opacity: 1; }
            100% { opacity: 0.99; }
        }

        #screen::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.2) 50%);
            z-index: 4;
            background-size: 100% 3px;
            pointer-events: none;
        }

        #screen::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, transparent 50%, rgba(0,0,0,0.8) 100%);
            z-index: 5;
            pointer-events: none;
        }

        #output {
            flex-grow: 1;
            overflow-y: auto;
            white-space: pre-wrap;
            margin-bottom: 10px;
            padding-right: 15px;
            z-index: 3;
            line-height: 1.3;
            word-wrap: break-word;
        }

        #input-line {
            display: none; 
            align-items: center;
            font-weight: bold;
            z-index: 3;
            margin-bottom: 10px;
        }

        #prompt { margin-right: 15px; transition: color 0.3s; }
        
        .cursor-blink {
            animation: blinker 1s linear infinite;
            color: inherit;
        }
        @keyframes blinker { 50% { opacity: 0; } }

        input[type="text"] {
            background: transparent;
            border: none;
            color: inherit;
            font-family: 'VT323', monospace;
            font-size: 1em;
            flex-grow: 1;
            outline: none;
            text-transform: uppercase;
            text-shadow: inherit;
            letter-spacing: 2px;
        }

        #hud-bar {
            display: none; 
            border-top: 2px solid #005b66;
            padding-top: 10px;
            margin-top: auto;
            font-size: 1.4rem;
            color: #5bc0de;
            text-shadow: none;
            z-index: 3;
            justify-content: space-between;
            flex-wrap: wrap;
        }

        .hud-stat {
            font-weight: bold;
        }
        .stat-critical { color: #ffab00; animation: blinker 1s infinite; }
        /* Intuition hints appear only on hover */
        @media (hover) {
            .hint-intuition::after {
                content: " (" attr(data-hint) ")";
                color: #3d94b8;
                opacity: 0;
                transition: opacity 1.2s;
            }
            .hud-stat:hover .hint-intuition::after {
                opacity: 0.75;
                text-shadow: none;
                font-family: 'VT323', monospace;
                font-size: 1.4em;
            }
        }

    </style>
</head>
<body>

<div id="chassis">
    <div class="rivet r-tl"></div>
    <div class="rivet r-tr"></div>
    <div class="rivet r-bl"></div>
    <div class="rivet r-br"></div>
    
    <div id="screen">
        <div id="output"></div>
        <div id="input-line">
            <span id="prompt">ATLAS_SYS></span>
            <input type="text" id="cmd" autocomplete="off">
        </div>
        <div id="hud-bar">
            <span id="hud-o2" class="hud-stat">O2: 100%</span>
            <span class="hud-stat" style="font-weight:bold; opacity:.8">▼</span>
            <span id="hud-pwr" class="hud-stat">PWR: 30%</span>
            <span id="hud-diff" class="hud-stat stat-critical">
                DYNAMIC DIFF: <span class="hint-intuition" data-hint="Pressure differential, in Pa">+</span>?? PA
            </span>
            <span id="hud-crew" class="hud-stat">CREW: UNKNOWN</span>
        </div>
    </div>

    <div id="hardware-panel">
        <span class="panel-label">SYS OVERRIDE</span>
        <div id="power-button-housing">
            <div id="power-button">⏻</div>
        </div>
    </div>
</div>

<script>
    const outputDiv = document.getElementById('output');
    const inputField = document.getElementById('cmd');
    const inputLine = document.getElementById('input-line');
    const promptSpan = document.getElementById('prompt');
    const hudBar = document.getElementById('hud-bar');
    const screen = document.getElementById('screen');
    const powerButton = document.getElementById('power-button');

    // HUD Elements
    const hudO2 = document.getElementById('hud-o2');
    const hudPwr = document.getElementById('hud-pwr');
    const hudDif = document.getElementById('hud-diff'); // dynamic differential

    let state = 'OFF';
    let isTyping = false;
    
    let audioCtx;
    let staticGainNode;
    let keyNoiseBuffer;

    // Physics + Narrative State Variables
    let metrics = {
        o2: 100,
        pwr: 30,
        hullIntegrity: 'STABLE', // New granularity beyond just CRITICAL/COMPROMISED
        crewAlive: true,
        aiCoreActive: true,
        commsTrunkSevered: false,
        hangarIrradiated: false,
        initialDiffusionRate: 15, // Starting diffusion coefficient for gas flow (Pa/s)
        diffusionDecayFactor: 0.75, // Gas escapes ~3/4 as fast after seal (second-order physics)
    };

    let currentNodeId = 'INIT';
    let lastUpdateSecs = performance.now(); 

    // --- SECOND ORDER GRAPH LOGIC (With Intuition & Physics Layer) ---
    const storyNodes = {
        'INIT': {
            text: "LUNAR FACILITY ARCHIMEDES.\nKINETIC IMPACT DETECTED. SECTOR 4 DESTROYED.\nSYSTEM VELOCITY: CASCADING FAILURE.\n\nYOU ARE SEALED IN THE OVERSEER QUARTERS.\nATMOSPHERE IS VENTING THROUGH MICRO-FRACTURES IN THE BULKHEAD.",
            choices: {
                '1': { 
                    id: 'SEAL_VENTS', 
                    effect: (node, currentMetrics) => {
                        currentMetrics.o2 -= 5; // immediate cost to act
                        // First-order: sealing halts venting — set diffusion rate very low
                        currentMetrics.initialDiffusionRate = 0.8; 
                        return `> VENTS SEALED.\nSECOND ORDER PHYSICS:\nDIFFUSION RATE REDUCED TO ~<span class="stat-critical">${currentMetrics.initialDiffusionRate}</span> Pa/s\n(Surface tension and gas friction now dominate over bulk flow)\n\n[1] DRAIN CRYO TO POWER DOORS\n[2] OVERRIDE AI GOVERNORS`;
                    }
                },
                '2': { 
                    id: 'HACK_DOOR',
                    effect: (node, currentMetrics) => {
                        currentMetrics.commsTrunkSevered = true;
                        // Keep initial high diffusion rate—vents remain open-ish
                        return `> DOOR OPENS. \nSECOND ORDER PHYSICS:\nNO O₂ SEALING PERFORMED.\nPRESSURE DIFFERENTIAL STILL HIGH.\nGAS WILL CONTINUE ESCAPING.\n\n[1] FIX REACTOR RELAY\n[2] RESCUE CREWMATE`;
                    }
                },
            },
        },
        'SEAL_VENTS': {
            text: (currentMetrics) => storyNodes['INIT'].choices['1'].effect(null, currentMetrics),
            choices: {
                '1': 'DRAIN_CRYO',
                '2': 'OVERRIDE_AI'
            }
        },
        'HACK_DOOR': {
            text: (currentMetrics) => storyNodes['INIT'].choices['2'].effect(null, currentMetrics),
            choices: {
                '1': 'FIX_RELAY',
                '2': 'RESCUE_CREW'
            }
        },

        'DRAIN_CRYO': {
            effect: () => { metrics.pwr += 40; metrics.crewAlive = false; },
            text: "FIRST ORDER EFFECT: LOCAL GRID RESTORED. DOOR UNLOCKED.\nSECOND ORDER PHYSICS:\nCRYOGENIC FLUID VAPORIZATION SPILLS INTO CORRIDORS—\nRISK OF CONDENSATION ON OPTICS.\n\n[1] MANUAL AIRLOCK OVERRIDE (HIGH RISK)\n[2] RE-WIRE COMMS ARRAY",
            choices: {
                '1': 'MANUAL_AIRLOCK',
                '2': 'REWIRE_COMMS'
            }
        },
        'OVERRIDE_AI': {
            effect: () => { metrics.pwr += 60; metrics.aiCoreActive = false; },
            text: "FIRST ORDER EFFECT: POWER SURGE RESTORES DOOR.\nSECOND ORDER PHYSICS:\nREACTOR COOLANT LOOP PULSES—\nTEMP VELOCITY: RISING. CORE STRESS NOT YET CRITICAL.\n\n[1] LAUNCH POD (NO NAV)\n[2] MANUAL SCRAM",
            choices: {
                '1': 'BLIND_LAUNCH',
                '2': 'MANUAL_SCRAM'
            }
        },
        
        'FIX_RELAY': {
            effect: () => { metrics.crewAlive = false; },
            text: "FIRST ORDER EFFECT: RADIATION CONTAINED.\nSECOND ORDER PHYSICS:\nMAGNETIC FLUX CHANGES—COMPASS CALIBRATION OFF.\nCREWMATE NOT SAVED.\n\nHANGAR: SHUTTLE INTACT. IGNITION REQUIRES ENGINEERING CLEARANCE OR AI UPLINK.",
            choices: {
                '1': 'HOTWIRE',
                '2': 'AI_UPLINK'
            }
        },
        'RESCUE_CREW': {
            effect: () => { metrics.o2 -= 15; }, // O₂ cost to rescue (more realistic)
            text: "FIRST ORDER EFFECT: CREWMATE SAVED. KEYCODES ACQUIRED.\nSECOND ORDER PHYSICS:\nYOUR SUIT ISO-HEATED OVERDRIVE DRAWS EXTRA PWR FROM GRID.\nPRESSURE DROP DETECTED—SIMULATIONS SHOW YOU RAN THROUGH HIGH-SHEAR FLOW.\n\n[1] PROCEED TO SECONDARY PODS WITH CREWMATE\n[2] RAD-DASH ANYWAY",
            choices: {
                '1': 'SECONDARY_PODS',
                '2': 'RAD_DASH'
            }
        },
        
        // TERMINAL ENDINGS
        'MANUAL_AIRLOCK': {
            text: "END OF LINE.\nWITHOUT BIOMETRICS OR AI ASSISTANCE, THE AIRLOCK FAILS. \nTHE CYCLING SEQUENCE TRIGGERS A SAFETY LOCKOUT.\n\nCRITICAL FAILURE IDENTIFIED:\nLACK OF SYSTEM COHERENCE — OPERATIONAL CHOICE IGNORED HUMAN RESOURCE INTEGRITY.",
            terminal: true
        },
        'REWIRE_COMMS': {
            text: "END OF LINE.\nCOMMS TRUNK SEVERED. NO PATHS TO SURFACE ANTENNA.\nOXYGEN LEVELS FALLING. YOUR FINAL TRANSMISSION IS A STATIC SIGH.\n\nCRITICAL FAILURE IDENTIFIED:\nIGNORING HARDWARE DEGRADATION—GAS LEAKAGE ≠ CABLE FAILURE.",
            terminal: true
        },
        'BLIND_LAUNCH': {
            text: "END OF LINE.\nPOD THRUSTS STRAIGHT UP. GRAVITY FIELD TAPERING NOT ACCOUNTED FOR.\nPITCH ROTATES — THROTTLE JITTER—THE POD SKIPS INTO VOID.\n\nCRITICAL FAILURE IDENTIFIED:\nMISSING SECONDARY PHYSICS—ATMOSPHERIC SHEAR IN ESTIMATES.",
            terminal: true
        },
        'MANUAL_SCRAM': {
            text: "END OF LINE.\nCORE TEMP IS ALREADY AT PSEUDO-EQUILIBRIUM. ROD insertion delays COOLANT surge by <20 ms—\nHEAT RAPIDLY OVERRUNS SAFE THRESHOLD.\n\nCRITICAL FAILURE IDENTIFIED:\nNOTICING EXPONENTIAL TEMPERATURE VELOCITY — AND CHOOSING NOT TO TRUST IT.",
            terminal: true
        },
        'HOTWIRE': {
            text: "END OF LINE.\nPUSH-BUTTON HOT-WIRE Bypasses Anti-theft ICs. SYSTEM LOCKDOWN.\nO₂ CONSUMED AT ~9.5 L/HR IN STASIS.\nYOU DRAIN IT TO 3% BEFORE THE ALARM EVEN SOUNDS.\n\nCRITICAL FAILURE IDENTIFIED:\nHARDWARE HONESTY — YOU DIDN'T ASK “WILL IT WORK?”\nYOU ASKED, “HOW MANY FAILURES DOES THIS COST?”",
            terminal: true
        },
        'AI_UPLINK': {
            text: "SURVIVAL SECURED.\nATLAS AI UPLINK SUCCEEDS. SHUTTLE INTEGRITY CHECKS COMPLETE.\n\nNOTE:\nPHYSICS MODEL USED TO TRAJECTORY-SKIP EARTH GRAVITY SLINGSHOT.\nYOU LAND NEAR KENNEDY SPACE CENTER.\nALL CREW EXPENDED—BUT SYSTEMS SURVIVED.\nLOGICAL. RATIONAL. FINAL.",
            terminal: true
        },
        'SECONDARY_PODS': {
            text: "SURVIVAL SECURED.\nYOU AND CREWMATE REACH SECONDARY POD.\nENGINEERING CODES BYPASS THE LOCKDOWN.\nO₂ CONSERVED DURING DEPRESSURIZATION—GAS FLOWS AT ~12 m/s\n(That's the speed of a Formula 1 car in your suit vents!)\nYOU LAUNCH.\n\nNOTE:\nBEST OUTCOME FOUND—USING *HUMAN* FLEXIBILITY, NOT MACHINE RIGIDITY.",
            terminal: true
        },
        'RAD_DASH': {
            text: "END OF LINE.\nTHE RADIATION ISN’T THE KILLER—IT’S THE SUIT OXIDE BREAKDOWN.\nAT ~50 mSv, YOUR POLYCARBONATE HELMET CLOUDS—VISIBILITY ZERO.\n\nCRITICAL FAILURE IDENTIFIED:\nIGNORED DOSE × EXPOSURE TIME — LETHAL INTEGRAL UNCALCULATED.",
            terminal: true
        }
    };

    function updateHUD(diff = null) {
        hudO2.innerText = `O₂: ${metrics.o2}%`;
        hudPwr.innerText = `PWR: ${Math.round(metrics.pwr)}%`;

        if (!diff || diff == null || isNaN(diff)) {
            hudDif.innerHTML = `DYNAMIC DIFF: <span class="hint-intuition" data-hint="Pressure differential, in Pa">?</span>? PA`;
        } else {
            const safeDiff = Math.abs(Math.round(diff));
            let diffStr = '';
            if (safeDiff > 10000) diffStr = `<span style="color:#f34">+${safeDiff} PA</span>`; 
            else if (safeDiff > 5000) diffStr = `+${safeDiff} PA`;
            else diffStr = `<span class="stat-critical">±${safeDiff}</span> PA`;
            
            hudDif.innerHTML = `DYNAMIC DIFF: <span class="hint-intuition" data-hint="${Math.round(safeDiff/10)} m/s gas flow">▼</span> ${diffStr}`;
        }

        let crewStatus = metrics.crewAlive ? "STASIS/ACTIVE" : "EXPENDED";
        if (!metrics.crewAlive) hudO2.classList.add('stat-critical');
        
        if (metrics.pwr <= 30 || (typeof diff !== 'undefined' && diff > 8000)) hudPwr.classList.add('stat-critical');
        else hudPwr.classList.remove('stat-critical');

        const hullClass = screen.parentElement.closest('#chassis').classList;
        
        // Visualize *severity*, not just boolean criticality
        if (metrics.pwr <= 10) {
            screen.style.boxShadow = 'inset 0 0 95px rgba(255, 60, 60, 0.3)';
        } else if (typeof diff !== 'undefined' && diff > 10000) {
            screen.classList.add('alert-active');
        } else {
            screen.style.boxShadow = '';
            screen.classList.remove('alert-active');
        }

        return safeDiff;
    }

    // New: Integrate physics decay function
    let gasLeakSimulationHandle;

    function startGasDecaySim() {
        if (gasLeakSimulationHandle) clearInterval(gasLeakSimulationHandle);
        
        gasLeakSimulationHandle = setInterval(() => {
            const now = performance.now();
            if (!screen.classList.contains('powered-on') || state !== 'ACTIVE') return;
            
            // Base decay logic — O2 decreases non-linearly over time, unless vents sealed
            let lossPerSec = metrics.initialDiffusionRate / 1000; 
            
            if (metrics.commsTrunkSevered) {
                // additional small drain if trunk is severed—just for tension, not game breaking
                lossPerSec += 0.15;
            }

            // Only affect gameplay after certain threshold reached to prevent immediate death at startup
            const oldO2 = metrics.o2;
            metrics.o2 -= lossPerSec; 
            if (metrics.o2 < 0) metrics.o2 = 0;

            updateHUD(lossPerSec * 150); // Simulated pressure in Pa

        }, 300); // updates faster than one would type
    }

    function renderNode(nodeIdOrFactoryFn) {
        currentNodeId = nodeIdOrFactoryFn;
        const nodeRaw = storyNodes[nodeIdOrFactoryFn];
        if (nodeRaw.terminal) {
            // stop any ongoing simulations or loops on ending
            if (gasLeakSimulationHandle) clearInterval(gasLeakSimulationHandle);
        }

        let nodeText = "";
        
        try {
            nodeText = typeof(nodeRaw.text) === 'function'
                ? nodeRaw.text(metrics)
                : nodeRaw.text;
        } catch (e) { 
            nodeText = `>> NODE RENDER ERROR: ${e.message}\nTERMINAL PAUSED.\nATLAS SYS: PROCEEDING TO SAFE STATE.`; 
        }

        if (!nodeText.trim().includes('CRITICAL')) updateHUD(metrics.initialDiffusionRate * 200);

        printText(nodeText, 30, () => {
            if (nodeRaw.terminal) {
                setTimeout(() => {
                    inputField.style.display = 'none';
                    promptSpan.innerText = "SYSTEM HALTED.";
                    deleteSave();
                    // turn off noise and button lights
                    screen.classList.add('powered-on'); 
                }, 1500);
            }
        });
        
        saveGame(); // persist after any choice or new state

        startGasDecaySim(); // resume decay
    }

    function handleInput(rawCmd) {
        if (isTyping || state !== 'ACTIVE') return;
        
        const sanitizedRaw = rawCmd.replace(/</g, "&lt;").replace(/>/g, "&gt;");
        const cmd = sanitizedRaw.trim();

        outputDiv.innerHTML += `<span style="color:#e0e0e0">> ${cmd}</span><br>`;
        inputField.value = '';
        
        if (cmd.length < 1) return;
        
        // parse numeric or keyword-based input
        let choiceId = cmd; // for simplicity in current code
        
        const node = storyNodes[currentNodeId];
        
        // Support both [1] style and explicit node names for adults/nerds who peek ahead
        if (typeof node.choices === 'object') {
            const matchKey = Object.keys(node.choices).find(k => 
                String(parseInt(k)) == cmd || k.toLowerCase().startsWith(choiceId.toLowerCase())
            );
            
            let nextNodeName = null;

            // Allow fallback lookup by explicit string match in keys, if input fails numeric check
            if (matchKey && typeof node.choices[matchKey] === 'string') {
                nextNodeName = node.choices[matchKey];
            } else if (node.choices[cmd]) {
                nextNodeName = cmd;
            }

            // Support advanced mode for those reading raw choices—just pass key as string directly
            const keys = Object.keys(node.choices);
            if (!nextNodeName && keys.includes(cmd.toUpperCase())) {
                nextNodeName = cmd.toUpperCase();
            } else if (keys.some(k => k.toLowerCase() == cmd.toLowerCase()) && typeof node.choices[cmd] === 'object') {
                nextNodeName = node.choices[cmd].id; // support complex choice object return
                cmd = nextNodeName;
            }

            // Resolve actual node id (especially for first-layer factory pattern nodes like INIT)
            if (!nextNodeName && typeof node.choices === 'function') { // this shouldn’t happen unless someone changes API
                nextNodeName = cmd; 
            } else {
                while (typeof node.choices[nextNodeName] === 'object' || typeof storyNodes[nextNodeName] === 'function') {
                    nextNodeName = typeof nextNodeName == 'string'
                        ? (typeof(storyNodes[nextNodeName]) === 'function'?storyNodes[nextNodeName]() : 
                          typeof(node.choices[nextNodeName].id) === 'undefined'?nextNodeName:node.choices[nextNodeName].id)
                        : nextNodeName;
                }
            }

            if (nextNodeName && storyNodes[nextNodeName]) {
                renderNode(nextNodeName);
            } else {
                printText(`>> UNRECOGNIZED CHOICE "${cmd.toUpperCase()}".\nSELECT VALID ID OR TRY FULL WORD (EX: SEAL_VENTS) FOR EXPERT MODE.`);
            }
        } else {
            if (!node.terminal) printText("SYSTEM STILL AWAITING INPUT...");
            // do not reset node logic
        }
    }

    powerButton.addEventListener('click', () => {
        if (state !== 'OFF') return; 
        
        powerButton.classList.add('active');
        
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        startStaticNoise();
        createKeyNoiseBuffer();
        playHardwareSwitch();

        screen.classList.remove('power-loss');
        setTimeout(() => {
            screen.classList.add('powered-on');
        }, 50);

        setTimeout(() => {
            inputLine.style.display = 'flex';
            
            if (localStorage.getItem('archimedes_save')) {
                state = 'RESTORE_PROMPT';
                printText("ATLAS PROTOCOL ONLINE.\nLOCAL CACHE DETECTED.\n[1] RESUME PREVIOUS OPERATION\n[2] WIPE CACHE AND RESTART\nINPUT TACTICAL CHOICE:");
            } else {
                state = 'ACTIVE';
                hudBar.style.display = 'flex';
                
                // Initial simulation starts now
                metrics.initialDiffusionRate = 10; 
                updateHUD();
                renderNode('INIT');
            }
        }, 2200); // longer boot, adds realism (spool up + self-tests)
    });

    inputField.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            let val = inputField.value.trim();
            if (val !== '') handleInput(val);
        } else if (e.key !== 'Shift' && !e.ctrlKey) {
            playKeyDown();
        }
    });

    // Audio Helpers (already mostly in your code — minor cleanup to make it smoother with UI states)

    function startStaticNoise() {
        const bufferSize = audioCtx.sampleRate * 2; 
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
        
        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;
        noise.loop = true;
        
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'highpass'; 
        filter.frequency.value = 1200; 

        staticGainNode = audioCtx.createGain();
        // make ambient sound dynamic — louder during crisis states
        staticGainNode.gain.setValueAtTime(0.003, audioCtx.currentTime);

        noise.connect(filter);
        filter.connect(staticGainNode);
        staticGainNode.connect(audioCtx.destination);
        noise.start();

        // Adjust volume if HUD is blinking critical status
        if (hudDif) {
            const observer = new MutationObserver(mutations => {
                mutations.forEach(mutation => {
                    const value = parseFloat(mutation.target.textContent.replace(/[^0-9.]/g, '') || 0);
                    if (value > 6000 && !hudDif.classList.contains('stat-critical')) {
                        // ramp volume up
                        staticGainNode.gain.rampToValueAtTime(0.0065, audioCtx.currentTime + 4); 
                        screen.classList.add('alert-active');
                    } else if (hudPwr.classList.contains('stat-critical') && hudO2.classList.contains('stat-critical')) {
                        // extreme failure state
                        staticGainNode.gain.linearRampToValueAtTime(0.015, audioCtx.currentTime + 2);
                    } else if (mutation.target.textContent.includes('±')) {
                        // returning to calm after stabilization
                        staticGainNode.gain.rampToValueAtTime(0.003, audioCtx.currentTime + 5);
                    }
                });
            });

            observer.observe(hudDif, { childList: true, attributes: false, characterData: true });
        }
    }

    function createKeyNoiseBuffer() {
        const bufferSize = audioCtx.sampleRate * 0.06; 
        keyNoiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const output = keyNoiseBuffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) output[i] = Math.random() * 2 - 1;
    }

    function playKeyDown() {
        if (!audioCtx || !keyNoiseBuffer) return;
        const t = audioCtx.currentTime;
        const source = audioCtx.createBufferSource();
        source.buffer = keyNoiseBuffer;
        
        // frequency variance makes each key feel like it's on a different chip — subtle personality
        const variance = 0.3 + Math.random()*0.5; 
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(2400 * variance, t);
        const gain = audioCtx.createGain();
        
        // louder during "crisis"
        let volumeScale = (metrics.pwr < 10) ? 0.5 : 1;
        if (metrics.initialDiffusionRate > 100 && metrics.o2 < 60)
            volumeScale *= 1.8; 

        gain.gain.setValueAtTime(0.1 * volumeScale, t);
        gain.gain.exponentialRampToValueAtTime(0.003, t + 0.03);

        source.connect(filter).connect(gain).connect(audioCtx.destination);
        source.start(t);
        source.stop(t + 0.05);
    }

    function printText(text, speed = 25, callback) {
        isTyping = true;
        inputField.disabled = true;
        const textWithBreaks = String(text)
            .replace(/\n/g, '<br/>')
            .replace(/$(\d+)$\s*(.*)/, `<br>[$1] <span style="font-size:1.5em; font-weight:bold">$2</span>`);

        let i = 0;
        outputDiv.innerHTML += '<div id="typewriter-layer" style="display:inline;"></div>';
        const writerLayer = document.getElementById('typewriter-layer');

        function typewriteLoop() {
            if (i >= text.length) {
                clearInterval(intervalId);
                isTyping = false;
                inputField.disabled = false;
                inputField.focus();
                writerLayer.innerHTML = "";
                
                // strip extra HTML wrapping to clean outputDiv again for next block
                while(outputDiv.lastChild && !outputDiv.lastChild.id.startsWith("hud") ) {
                    const brs = Array.from(document.querySelectorAll("br")); 
                    brs.forEach(x => x.remove());
                }

                if (callback) callback();
                return;
            }
            
            // Support embedded tags and styling within typewriter text
            let charToInsert = "";
            while(i < text.length && [ '<', '>' ].includes(text[i])) {
                charToInsert += text.charAt(i++);
            }
            charToInsert += text.charAt(i++);
            writerLayer.innerHTML += charToInsert;
            
            if (charToInsert !== " ") playKeyDown();
            
            outputDiv.scrollTop = outputDiv.scrollHeight;
            
            // Slow down slightly for special chars for readability
            let delay = speed;
            if ("<>.:,".includes(text.charAt(i)) && text[i] === charToInsert.slice(-1))
                delay += 30;
                
            setTimeout(typewriteLoop, delay);
        }

        const intervalId = setTimeout(typewriteLoop, speed);
    }

    // Save/load logic stays the same as before but uses updated state
    function saveGame() {
        localStorage.setItem('archimedes_save', JSON.stringify({ currentNodeId, metrics }));
    }
    function loadGame() {
        const savedData = JSON.parse(localStorage.getItem('archimedes_save'));
        currentNodeId = savedData.currentNodeId;
        metrics = savedData.metrics;
        
        // Reset UI and visuals to match restored state
        hudO2.innerText = `O₂: ${Math.round(metrics.o2)}%`;
        updateHUD(); // recalcs pressure differential too
        
        renderNode(currentNodeId);
    }
    
    function deleteSave() {
        localStorage.removeItem('archimedes_save');
    }

</script>
