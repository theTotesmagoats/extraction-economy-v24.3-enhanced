<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Terminal Mk V - Archimedes Base</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #010409;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'VT323', monospace;
            overflow: hidden;
            user-select: none;
        }

        #chassis {
            background-color: #111418;
            width: 96vw;
            height: 96vh;
            padding: 40px 40px 80px 40px; 
            border-radius: 12px;
            box-sizing: border-box;
            box-shadow: inset 0 0 30px #000, 0 0 50px rgba(0,229,255,0.05);
            border: 8px solid #080a0c;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .rivet {
            position: absolute;
            width: 14px;
            height: 14px;
            background: #222;
            border-radius: 50%;
            box-shadow: inset 2px 2px 4px #444, inset -2px -2px 4px #000;
        }
        .r-tl { top: 12px; left: 12px; }
        .r-tr { top: 12px; right: 12px; }
        .r-bl { bottom: 12px; left: 12px; }
        .r-br { bottom: 12px; right: 12px; }

        #hardware-panel {
            position: absolute;
            bottom: 15px;
            right: 40px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .panel-label {
            color: #4a6b7c;
            font-family: sans-serif;
            font-size: 0.8rem;
            font-weight: bold;
            letter-spacing: 2px;
            text-shadow: -1px -1px 1px #000;
        }

        #power-button-housing {
            width: 50px;
            height: 50px;
            background: #080a0c;
            border-radius: 50%;
            box-shadow: 0 0 10px #000, inset 2px 2px 5px #1a2229, inset -2px -2px 5px #000;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #power-button {
            width: 36px;
            height: 36px;
            background: #102a3a; 
            border-radius: 50%;
            box-shadow: inset 2px 2px 4px #1c4966, inset -2px -2px 4px #050d12, 2px 2px 5px rgba(0,0,0,0.8);
            color: #0a1b26; 
            font-family: sans-serif;
            font-size: 18px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.1s;
        }

        #power-button.active {
            box-shadow: inset 2px 2px 6px #050d12, inset -2px -2px 6px #1c4966, 0 0 2px #000;
            transform: scale(0.95);
            color: #00e5ff;
            text-shadow: 0 0 5px #00e5ff;
        }

        #screen {
            background: #010812;
            width: 100%;
            height: 100%;
            border-radius: 4px; 
            padding: 35px;
            box-sizing: border-box;
            box-shadow: inset 0 0 80px rgba(0,0,0,1), 0 0 10px rgba(0,229,255,0.05);
            border: 4px solid #031424;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            color: #00e5ff; 
            text-shadow: 0 0 3px #00e5ff, 0 0 8px rgba(0, 229, 255, 0.4); 
            font-size: 1.8rem;
            letter-spacing: 1.5px;
            animation: flicker 0.15s infinite;
            
            opacity: 0;
            transition: opacity 1.5s ease-in;
        }

        #screen.powered-on {
            opacity: 1;
        }

        @keyframes alertPulse {
            0% { box-shadow: inset 0 0 80px rgba(0,0,0,1); border-color: #031424; }
            50% { box-shadow: inset 0 0 120px rgba(255, 171, 0, 0.2); border-color: #ffab00; }
            100% { box-shadow: inset 0 0 80px rgba(0,0,0,1); border-color: #031424; }
        }
        .alert-active {
            animation: alertPulse 1.5s infinite !important;
            color: #ffab00 !important;
            text-shadow: 0 0 4px #ffab00 !important;
        }

        @keyframes flicker {
            0% { opacity: 0.98; }
            50% { opacity: 1; }
            100% { opacity: 0.99; }
        }

        #screen::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.2) 50%);
            z-index: 4;
            background-size: 100% 3px;
            pointer-events: none;
        }

        #screen::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, transparent 50%, rgba(0,0,0,0.8) 100%);
            z-index: 5;
            pointer-events: none;
        }

        #output {
            flex-grow: 1;
            overflow-y: auto;
            white-space: pre-wrap;
            margin-bottom: 10px;
            padding-right: 15px;
            z-index: 3;
            line-height: 1.3;
            word-wrap: break-word;
        }

        #input-line {
            display: none; 
            align-items: center;
            font-weight: bold;
            z-index: 3;
            margin-bottom: 10px;
        }

        #prompt { margin-right: 15px; transition: color 0.3s; }
        
        .cursor-blink {
            animation: blinker 1s linear infinite;
            color: inherit;
        }
        @keyframes blinker { 50% { opacity: 0; } }

        input[type="text"] {
            background: transparent;
            border: none;
            color: inherit;
            font-family: 'VT323', monospace;
            font-size: 1em;
            flex-grow: 1;
            outline: none;
            text-transform: uppercase;
            text-shadow: inherit;
            letter-spacing: 2px;
        }

        #hud-bar {
            display: none; 
            border-top: 2px solid #005b66;
            padding-top: 10px;
            margin-top: auto;
            font-size: 1.4rem;
            color: #5bc0de;
            text-shadow: none;
            z-index: 3;
            justify-content: space-between;
            flex-wrap: wrap;
        }

        .hud-stat {
            font-weight: bold;
        }
        .stat-critical { color: #ffab00; animation: blinker 1s infinite; }

        @media (hover) {
            .hint-intuition::after {
                content: " (" attr(data-hint) ")";
                color: #3d94b8;
                opacity: 0;
                transition: opacity 1.2s;
            }
            .hud-stat:hover .hint-intuition::after {
                opacity: 0.75;
                text-shadow: none;
                font-family: 'VT323', monospace;
                font-size: 1.4em;
            }
        }
    </style>
</head>
<body>

<div id="chassis">
    <div class="rivet r-tl"></div>
    <div class="rivet r-tr"></div>
    <div class="rivet r-bl"></div>
    <div class="rivet r-br"></div>
    
    <div id="screen">
        <div id="output"></div>
        <div id="input-line">
            <span id="prompt">ATLAS_SYS></span>
            <input type="text" id="cmd" autocomplete="off">
        </div>
        <div id="hud-bar">
            <span id="hud-o2" class="hud-stat">O2: 100%</span>
            <span class="hud-stat" style="font-weight:bold; opacity:.8">▼</span>
            <span id="hud-pwr" class="hud-stat">PWR: 30%</span>
            <span id="hud-diff" class="hud-stat stat-critical">
                DYNAMIC DIFF: <span class="hint-intuition" data-hint="Pressure differential, in Pa">+</span>?? PA
            </span>
            <span id="hud-crew" class="hud-stat">CREW: UNKNOWN</span>
        </div>
    </div>

    <div id="hardware-panel">
        <span class="panel-label">SYS OVERRIDE</span>
        <div id="power-button-housing">
            <div id="power-button">⏻</div>
        </div>
    </div>
</div>

<script>
    const outputDiv = document.getElementById('output');
    const inputField = document.getElementById('cmd');
    const inputLine = document.getElementById('input-line');
    const promptSpan = document.getElementById('prompt');
    const hudBar = document.getElementById('hud-bar');
    const screen = document.getElementById('screen');
    const powerButton = document.getElementById('power-button');

    // HUD Elements
    const hudO2 = document.getElementById('hud-o2');
    const hudPwr = document.getElementById('hud-pwr');
    const hudDif = document.getElementById('hud-diff'); 

    let state = 'OFF';
    let isTyping = false;
    
    let audioCtx;
    let staticGainNode;
    let keyNoiseBuffer;

    // Physics + Narrative State Variables
    let metrics = {
        o2: 100,
        pwr: 30,
        hullIntegrity: 'STABLE', 
        crewAlive: true,
        aiCoreActive: true,
        commsTrunkSevered: false,
        hangarIrradiated: false,
        initialDiffusionRate: 15, 
        diffusionDecayFactor: 0.75
    };

    let currentNodeId = 'INIT';
    
    // --- SECOND ORDER GRAPH LOGIC ---
    const storyNodes = {
        'INIT': {
            text: "LUNAR FACILITY ARCHIMEDES.\nKINETIC IMPACT DETECTED. SECTOR 4 DESTROYED.\nSYSTEM VELOCITY: CASCADING FAILURE.\n\nYOU ARE SEALED IN THE OVERSEER QUARTERS.\nATMOSPHERE IS VENTING THROUGH MICRO-FRACTURES IN THE BULKHEAD.\nSELECT IMMEDIATE TACTICAL RESPONSE:\n[1] SEAL VENTS WITH STRUCTURAL FOAM\n[2] HACK MAGNETIC DOOR SEAL TO ESCAPE TO CORRIDOR",
            choices: {
                '1': { 
                    id: 'SEAL_VENTS', 
                    effect: () => {
                        metrics.o2 -= 5; // immediate cost to act
                        metrics.initialDiffusionRate = 0.8;
                    }
                },
                '2': { 
                    id: 'HACK_DOOR',
                    effect: () => {
                        metrics.commsTrunkSevered = true;
                    }
                },
            },
        },
        
        // Now dynamic text nodes for choice-specific physics flavor
        'SEAL_VENTS': (m) => {
            return `> VENTS SEALED.\nSECOND ORDER PHYSICS:\nDIFFUSION RATE REDUCED TO ~<span class="stat-critical">${m.initialDiffusionRate}</span> Pa/s\n(Surface tension and gas friction dominate).\n\nYOU ARE TRAPPED IN THE ROOM. MAIN TERMINAL HAS LIMITED ACCESS.\nSELECT TACTICAL RESPONSE:\n[1] DRAIN CRYOGENICS TO POWER DOORS\n[2] OVERRIDE AI GOVERNORS`;
        },

        'HACK_DOOR': (m) => {
            return `> DOOR OPENS.\nSECOND ORDER PHYSICS:\nNO O₂ SEALING PERFORMED—PRESSURE DIFFERENTIAL REMAINS HIGH.\nGAS CONTINUES ESCAPING AT INITIAL VELOCITY.\n\nYOU STEP INTO CORRIDOR. ZERO-G ENVIRONMENT.\nDEBRIS FLOATS NEAR SPARKING REACTOR RELAY.\nCREWMATE IS PINNED BEHIND FALLEN STRUT.\nSELECT TACTICAL RESPONSE:\n[1] FIX RELAY (PRESERVE HANGAR)\n[2] RESCUE CREWMATE (EXPEND SUIT O₂)`;
        },

        'DRAIN_CRYO': {
            effect: () => { metrics.pwr += 40; metrics.crewAlive = false; },
            text: "FIRST ORDER EFFECT: LOCAL GRID RESTORED. DOOR UNLOCKED.\nSECOND ORDER PHYSICS:\nCRYOGENIC FLUID VAPORIZATION—RISK OF CONDENSATION ON OPTICS.\n\n[1] MANUAL AIRLOCK OVERRIDE\n[2] RE-WIRE COMMS ARRAY",
            choices: {
                '1': 'MANUAL_AIRLOCK',
                '2': 'REWIRE_COMMS'
            }
        },
        'OVERRIDE_AI': {
            effect: () => { metrics.pwr += 60; metrics.aiCoreActive = false; },
            text: "FIRST ORDER EFFECT: POWER SURGE RESTORES DOOR.\nSECOND ORDER PHYSICS:\nCOOLANT LOOP PULSE DETECTED—TEMPERATURE RISE STABILIZES… FOR NOW.\n\n[1] LAUNCH POD (BLIND)\n[2] MANUAL SCRAM",
            choices: {
                '1': 'BLIND_LAUNCH',
                '2': 'MANUAL_SCRAM'
            }
        },
        
        'FIX_RELAY': {
            effect: () => { metrics.crewAlive = false; },
            text: "FIRST ORDER EFFECT: RADIATION CONTAINED.\nSECOND ORDER PHYSICS:\nMAGNETIC FLUX SHIFTS—COMPASS CALIBRATION OFF BY ~4°\nCREWMATE LOST IN DEBRIS.\n\nYOU REACH HANGAR. SHUTTLE INTACT, BUT LOCKOUT ACTIVE.\n[1] BRUTE-FORCE HOTWIRE\n[2] AI UPLINK",
            choices: {
                '1': 'HOTWIRE',
                '2': 'AI_UPLINK'
            }
        },
        'RESCUE_CREW': {
            effect: () => { metrics.o2 -= 15; }, 
            text: "FIRST ORDER EFFECT: CREWMATE SAVED. ENGINEERING CODES ACQUIRED.\nSECOND ORDER PHYSICS:\nO₂ USE SPiked—YOUR SUIT HEAT EXCHANGER IS STRAINED.\nPRESSURE DIFFERENTIAL DROPS TO ~2,300 PA.\n\n[1] SECONDARY PODS (SAFE)\n[2] RAD-DASH ANYWAY",
            choices: {
                '1': 'SECONDARY_PODS',
                '2': 'RAD_DASH'
            }
        },

        // ENDINGS — same as before
        'MANUAL_AIRLOCK': {
            text: "END OF LINE.\nThe AIRLOCK FAILS WITHOUT BIOMETRICS.\nYOU ARE PURGED WITH DEBRIS INTO SPACE.\n\nCRITICAL FAILURE:\nSYSTEM COHERENCE OVERLOOKED—HUMAN RESOURCES MATTER.",
            terminal: true
        },
        'REWIRE_COMMS': {
            text: "END OF LINE.\nCOMMS TRUNK SEVERED. NO PATHS TO ANTENNA.\nYOU DRAIN O₂ IN TOTAL SILENCE.\n\nCRITICAL FAILURE:\nIGNORING PHYSICAL CASCADE — LEAK ≠ SIGNAL FAILURE.",
            terminal: true
        },
        'BLIND_LAUNCH': {
            text: "END OF LINE.\nThe pod exits without NAV. LUNAR GRAVITY SLOWS IT, THEN FLINGS IT OUTWARD.\nO₂ DEPLETED IN 8 HRS. NO DISTRESS SIGNAL.\n\nCRITICAL FAILURE:\nOMITTING SECONDARY PHYSICS (ATMOSPHERIC SHEAR).",
            terminal: true
        },
        'MANUAL_SCRAM': {
            text: "END OF LINE.\nThe core is *already* at pseudo-stable. Insertion lags behind heat front.\nYOU HIT THE LEVER… TOO LATE.\n\nCRITICAL FAILURE:\nNOTICING VELOCITY—AND CHOOSING TO ACT ON IT.",
            terminal: true
        },
        'HOTWIRE': {
            text: "END OF LINE.\nPUSH-BUTTON bypass trips security ICs. SYSTEM LOCKS.\nO₂ FALLS TO 3% BEFORE ALARM SOUNDS.\n\nCRITICAL FAILURE:\nDISREGARD FOR INTEGRITY—NO ONE PLANS TO BREAK PROTOCOL AND GET AWAY WITH IT.",
            terminal: true
        },
        'AI_UPLINK': {
            text: "SURVIVAL SECURED.\nATLAS AI UPLINK COMPLETE. SHUTTLE CHECKS PASS.\nPHYSICS MODEL USED FOR GRAVITY SKIP CALCULATION.\nYOU LAND NEAR KENNEDY.\nALL CREW LOST, BUT THE SYSTEM LIVES.\nLOGICAL.",
            terminal: true
        },
        'SECONDARY_PODS': {
            text: "SURVIVAL SECURED.\nYOU AND CREWMATE REACH POD. KEYCODES BYPASS LOCKDOWN.\nGAS EXPULSION ESTIMATED AT 12 m/s — ~F-16 TAKEOFF VELOCITY INSIDE YOUR HELMET!\nYOU LAUNCH SAFELY.\nBEST OUTCOME—USING FLEXIBILITY OVER RIGID AUTOMATION.",
            terminal: true
        },
        'RAD_DASH': {
            text: "END OF LINE.\nThe radiation doesn’t burn—you see the POLYCARBONATE ON YOUR HELMET CLOUDING IN REAL-TIME.\nVISIBILITY 0. O₂ 4%. COLLAPSE BEFORE ALERT.\n\nCRITICAL FAILURE:\nIGNORED LETHAL INTEGRALS (DOSE × TIME).",
            terminal: true
        }
    };

    // New helper for updating pressure gradient based on state
    function calculateDiff() {
        const base = 1000; 
        const leak = metrics.commsTrunkSevered ? 7000 : 0;
        return Math.max(120, (leak + metrics.initialDiffusionRate * 65)); 
    }

    function updateHUD() {
        hudO2.innerText = `O₂: ${Math.floor(metrics.o2)}%`;
        hudPwr.innerText = `PWR: ${Math.floor(metrics.pwr)}%`;
        
        const currentDiff = calculateDiff();
        let diffStr;
        if (currentDiff > 5000) diffStr = `<span class="stat-critical">+${currentDiff} PA</span>`;
        else diffStr = `+${currentDiff} PA`;
        
        hudDif.innerHTML = `DYNAMIC DIFF: <span class="hint-intuition" data-hint="${Math.round(currentDiff / 20)} m/s flow rate">▼</span> ${diffStr}`;

        hudO2.classList.remove('stat-critical');
        hudPwr.classList.remove('stat-critical');
        screen.classList.remove('alert-active');

        if (metrics.o2 <= 40 || currentDiff > 10000) hudO2.classList.add('stat-critical');
        
        if (metrics.pwr <= 20) hudPwr.classList.add('stat-critical');

        // Alert visual when O2 + Diff are both bad
        if ((metrics.o2 < 45 || currentDiff > 7000)) screen.classList.add('alert-active');
        
    }

    function startGasDecaySim() {
        if (window.decayTimer) clearInterval(window.decayTimer);
        window.decayTimer = setInterval(() => {
            const now = performance.now();
            
            let lossPerSec = metrics.initialDiffusionRate / 500;
            
            if (metrics.commsTrunkSevered) {
                // slight continuous leak even after fix
                lossPerSec += 0.35;
            }
            
            metrics.o2 -= lossPerSec;
            if (metrics.o2 < 0) metrics.o2 = 0;
            
            updateHUD();
        }, 350);
    }

    function renderNode(nodeIdOrFactoryFn) {
        let nodeId = nodeIdOrFactoryFn;

        // If factory function, invoke with current metrics
        let nodeText = storyNodes[nodeId];
        
        if (typeof(nodeText) === 'function') {
            try {
                nodeText = nodeText(metrics);
                if (storyNodes[nodeId].effect && typeof storyNodes[nodeId].effect === "function") 
                    storyNodes[nodeId].effect();
            } catch (e) {
                nodeText = `>> NODE ERROR: ${nodeId} — FATAL.`;
                nodeId = null; // break cycle
            }
        }

        currentNodeId = nodeId || 'INIT';

        if (nodeId && !storyNodes[nodeId].terminal) {
            if (typeof storyNodes[nodeId] !== 'function' && storyNodes[nodeId].effect)
                storyNodes[nodeId].effect();

            printText(nodeText, 20, () => {
                updateHUD(); // recalibrate after text prints
                startGasDecaySim(); 
            });

        } else if (storyNodes[nodeId]?.terminal) {
            clearInterval(window.decayTimer);
            printText(nodeText, 30, () => {
                inputField.style.display = 'none';
                promptSpan.innerText = "SYSTEM HALTED.";
                screen.classList.remove('alert-active');
                if(staticGainNode)
                    staticGainNode.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 2);
            });
        }

        saveGame(); // persist after every move
    }

    function handleInput(rawCmd) {
        const sanitizedRaw = rawCmd.replace(/</g, "&lt;").replace(/>/g, "&gt;");
        const cmd = sanitizedRaw.trim().toUpperCase();

        outputDiv.innerHTML += `<span style="color:#e0e0e0">> ${rawCmd}</span><br>`;
        inputField.value = '';
        
        if (!cmd) return;
        
        // RESTORE PROMPT Logic — now *actually* usable!
        if (state === 'RESTORE_PROMPT') {
            if (cmd === '1' || cmd.toLowerCase().includes('resume')) {
                state = 'ACTIVE';
                hudBar.style.display = 'flex';
                loadGame();
                printText(">> RESTORATION COMPLETE.\nREBOOTING PHYSICS LAYER...\nATLAS SYS: READY.");
                return;
            }
            else if (cmd === '2' || cmd.toLowerCase().includes('wipe')) {
                state = 'ACTIVE';
                deleteSave();
                hudBar.style.display = 'flex';
                metrics.initialDiffusionRate = 10; // reset diffusion
                updateHUD(); // set defaults again
                renderNode('INIT');
                printText(">> CACHE PURGED.\nINITIALIZING FIRST NODE: INITIAL");
                return;
            }
            else {
                printText("INVALID SELECTION. TRY [1] TO RESUME, OR [2] TO WIPE CACHE AND RESTART.");
                return;
            }
        }

        if (state === 'ACTIVE' && currentNodeId in storyNodes) {
            const node = storyNodes[currentNodeId];

            // Check for function nodes that auto-exit when printed
            if (typeof(node) === 'function') {
                printText(">> SYNTAX ERROR IN DATA. PLEASE CHECK TACTICAL SELECTION.");
                return;
            }
            
            let choicesObj = {};
            if (node && node.choices && typeof node.choices !== "function")
                choicesObj = node.choices;

            // Support [1] input and raw key string match
            let choiceKey = null;

            for(let key in choicesObj) {
                // exact number matches first
                if (parseInt(key) === parseInt(cmd)) {
                    choiceKey = key;
                    break;
                } else if (typeof(choicesObj[key]) === "object") { // support object forms
                    const nextNodeName = Object.values(choicesObj[key]);
                    if(nextNodeName.includes(cmd)) choiceKey=key; 
                } else {
                    // allow keyword partial match e.g. RES, RE
                    const candidate = String(key).toLowerCase();
                    const inputMatch = cmd.toLowerCase().startsWith(candidate.slice(0,3));
                    
                    if(inputMatch) choiceKey = key;
                }
            }

            // Final fallback: if command string literally exists as a key or target in the node list 
            let nextNodeName = null;
            if (!choiceKey && (cmd in storyNodes)) nextNodeName= cmd; // direct navigation (nerd mode!)
            
            // If no key matched but user typed "seal vents" etc try find via substrings
            else if (!choiceKey && typeof(choicesObj) === 'object' ) {
                Object.keys(choicesObj).some(k => {
                    let val = choicesObj[k];
                    let str = val.id?val.id:val;
                    return str.toLowerCase().includes(cmd.toLowerCase());
                })
            }

            if (nextNodeName || choiceKey) {
                const resolvedChoiceId = nextNodeName 
                    ? nextNodeName
                    : choicesObj[choiceKey] && choicesObj[choiceKey].id
                        ? choicesObj[choiceKey].id 
                        : choicesObj[choiceKey];
                renderNode(resolvedChoiceId);
            }
            else {
                printText(`UNRECOGNIZED COMMAND "${cmd}". SELECT [1], [2], OR TRY A FULL NODE ID.`);
            }
        }
    }

    powerButton.addEventListener('click', () => {
        if (state !== 'OFF') return; 
        
        powerButton.classList.add('active');
        
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        startStaticNoise();
        createKeyNoiseBuffer();
        playHardwareSwitch();

        screen.style.opacity = "0";
        screen.classList.remove('power-loss');

        setTimeout(() => {
            screen.classList.add('powered-on');
            setTimeout(() => inputLine.style.display = 'flex', 800);

            if (localStorage.getItem('archimedes_save')) {
                state = 'RESTORE_PROMPT';
                printText("ATLAS PROTOCOL ONLINE. LOCAL CACHE DETECTED.\n[1] RESUME PREVIOUS OPERATION\n[2] WIPE CACHE AND RESTART\nINPUT TACTICAL CHOICE:");
            } else {
                state = 'ACTIVE';
                hudBar.style.display = 'flex';
                
                metrics.initialDiffusionRate = 10; 
                updateHUD();
                renderNode('INIT');
            }
        }, 1750); // boot spool time for dramatic effect
    });

    inputField.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            handleInput(inputField.value.trim());
        } else if (e.key !== 'Shift' && !e.ctrlKey && !e.altKey) {
            playKeyDown();
        }
    });

    // --- AUDIO ENGINE ---

    function startStaticNoise() {
        const bufferSize = audioCtx.sampleRate * 2; 
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
        
        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;
        noise.loop = true;
        
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'highpass'; 
        filter.frequency.value = 1200; 

        staticGainNode = audioCtx.createGain();
        staticGainNode.gain.setValueAtTime(0.003, audioCtx.currentTime);

        noise.connect(filter);
        filter.connect(staticGainNode);
        staticGainNode.connect(audioCtx.destination);
        noise.start();
    }

    function createKeyNoiseBuffer() {
        const bufferSize = audioCtx.sampleRate * 0.06; 
        keyNoiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const output = keyNoiseBuffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) output[i] = Math.random() * 2 - 1;
    }

    function playKeyDown() {
        if (!audioCtx || !keyNoiseBuffer) return;
        const t = audioCtx.currentTime;
        
        const variance = 0.3 + Math.random()*0.5; 
        
        const source = audioCtx.createBufferSource();
        source.buffer = keyNoiseBuffer;

        const filter = audioCtx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(2400 * variance, t);
        
        let volMult = (metrics.pwr < 10) ? 0.5 : 1;
        if (metrics.initialDiffusionRate > 50 && metrics.o2 < 60) volMult *= 2;

        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(0.08 * volMult, t);
        gain.gain.exponentialRampToValueAtTime(0.003, t + 0.05);

        source.connect(filter).connect(gain).connect(audioCtx.destination);
        
        source.start(t);
        source.stop(t + 0.07);
    }

    function printText(text, speed = 20, callback) {
        isTyping = true;
        inputField.disabled = true;

        const formattedText = String(text)
            .replace(/\n/g, '<br/>')
            // Fix: proper escaping, and /g for all occurrences
            .replace(/$(\d+)$\s*(.*)/g, `<br><span class="prompt-option">[$1] <span style="color:#6ee7f7">$2</span></span>`)
        ;
        
        const writerLayer = document.createElement('div');
        outputDiv.appendChild(writerLayer);
        writerLayer.style.whiteSpace = 'pre-wrap'; 
        let i = 0;
        
        function typeNext() {
            if (i >= formattedText.length) {
                isTyping = false;
                inputField.disabled = false;
                inputField.focus();

                // No destructive cleanup needed anymore—append only
                writerLayer.style.display = "block";
                
                callback && callback();
                return;
            }
            
            const char = formattedText[i];

            // Proper tag handling
            if (char === '<') {
                let tagContent = "";
                while(i < formattedText.length && formattedText[i] !== '>') {
                    tagContent += formattedText[i++];
                }
                if(formattedText[i] === '>')
                    tagContent += formattedText[i++];

                writerLayer.innerHTML += tagContent;
            } else {
                // text characters
                const el = document.createTextNode(char);
                writerLayer.appendChild(el);

                // play sound only on visible chars
                if (char !== ' ' && char !== '\t' && ![".",";",":","/"].includes(formattedText[i]))
                    playKeyDown();

                i++;
            }
            
            outputDiv.scrollTop = outputDiv.scrollHeight;
            
            let delay = speed;

            // Slight pause after punctuation for rhythm
            if(i > 1 && [".", ";", ":", "?", "!"].includes(formattedText[i-1]) )
                delay += 70;
            
            setTimeout(typeNext, Math.max(delay, 5));
        }
        
        setTimeout(typeNext, speed);
    }

    function saveGame() {
        const data = { 
            currentNodeId,
            metrics: Object.assign({}, metrics)
        };
        localStorage.setItem('archimedes_save', JSON.stringify(data));
    }

    function loadGame() {
        try {
            const savedData = JSON.parse(localStorage.getItem('archimedes_save'));
            currentNodeId = savedData.currentNodeId || 'INIT';
            // merge loaded state safely, ensuring any new metrics added get default fallbacks
            Object.assign(metrics, savedData.metrics);
            
            hudBar.style.display = 'flex';
            
            printText(">> LOAD COMPLETE. SYSTEM VERIFIED.\nPHYSICS ENGINE REACTIVATED.\nATLAS SYS: READY FOR NEXT CHOICE.");
        } catch(err) {
            console.warn('save corrupted:', err.message);
            alert("SAVE CORRUPTED—WILL BEGIN NEW RUN.");
            deleteSave();
            state = 'ACTIVE';
            hudBar.style.display = 'flex';
            renderNode('INIT');
        }
    }

    function deleteSave() {
        localStorage.removeItem('archimedes_save');
    }

</script>
