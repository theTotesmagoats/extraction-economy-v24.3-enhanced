<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Terminal Mk XI - Archimedes Base</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #010409;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'VT323', monospace;
            overflow: hidden;
            user-select: none;
        }

        #chassis {
            background-color: #111418;
            width: 96vw;
            height: 96vh;
            padding: 40px 40px 80px 40px; 
            border-radius: 12px;
            box-sizing: border-box;
            box-shadow: inset 0 0 30px #000, 0 0 50px rgba(0,229,255,0.05);
            border: 8px solid #080a0c;
            position: relative;
            display: flex;
            flex-direction: column;
            transition: transform 0.05s, border-color 0.3s;
        }

        .rivet {
            position: absolute;
            width: 14px;
            height: 14px;
            background: #222;
            border-radius: 50%;
            box-shadow: inset 2px 2px 4px #444, inset -2px -2px 4px #000;
        }
        .r-tl { top: 12px; left: 12px; }
        .r-tr { top: 12px; right: 12px; }
        .r-bl { bottom: 12px; left: 12px; }
        .r-br { bottom: 12px; right: 12px; }

        #hardware-panel {
            position: absolute;
            bottom: 15px;
            right: 40px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .panel-label {
            color: #4a6b7c;
            font-family: sans-serif;
            font-size: 0.8rem;
            font-weight: bold;
            letter-spacing: 2px;
            text-shadow: -1px -1px 1px #000;
        }

        #power-button-housing {
            width: 50px;
            height: 50px;
            background: #080a0c;
            border-radius: 50%;
            box-shadow: 0 0 10px #000, inset 2px 2px 5px #1a2229, inset -2px -2px 5px #000;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #power-button {
            width: 36px;
            height: 36px;
            background: #102a3a; 
            border-radius: 50%;
            box-shadow: inset 2px 2px 4px #1c4966, inset -2px -2px 4px #050d12, 2px 2px 5px rgba(0,0,0,0.8);
            color: #0a1b26; 
            font-family: sans-serif;
            font-size: 18px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.1s;
        }

        #power-button.active {
            box-shadow: inset 2px 2px 6px #050d12, inset -2px -2px 6px #1c4966, 0 0 2px #000;
            transform: scale(0.95);
            color: #00e5ff;
            text-shadow: 0 0 5px #00e5ff;
        }

        #screen {
            background: #010812;
            width: 100%;
            height: 100%;
            border-radius: 4px; 
            padding: 35px;
            box-sizing: border-box;
            box-shadow: inset 0 0 80px rgba(0,0,0,1), 0 0 10px rgba(0,229,255,0.05);
            border: 4px solid #031424;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            color: #00e5ff; 
            text-shadow: 0 0 3px #00e5ff, 0 0 8px rgba(0, 229, 255, 0.4); 
            font-size: 1.8rem;
            letter-spacing: 1.5px;
            animation: flicker 0.15s infinite;
            
            opacity: 0;
            transition: opacity 1.5s ease-in;
        }

        #screen.powered-on {
            opacity: 1;
        }

        /* HARDWARE BROWNOUT GLITCH */
        .glitch-brownout {
            opacity: 0.2 !important;
            background: #000 !important;
            text-shadow: none !important;
            box-shadow: inset 0 0 100px rgba(0,0,0,1) !important;
        }

        /* ALGORITHMIC TEARING GLITCH */
        .glitch-strike {
            transform: translate(-3px, 2px) skew(-2deg) !important;
            text-shadow: 3px 0 0 #ff0055, -3px 0 0 #00e5ff !important;
            filter: contrast(150%) brightness(120%) !important;
            color: #fff !important;
        }

        @keyframes alertPulse {
            0% { box-shadow: inset 0 0 80px rgba(0,0,0,1); border-color: #031424; }
            50% { box-shadow: inset 0 0 120px rgba(255, 171, 0, 0.2); border-color: #ffab00; }
            100% { box-shadow: inset 0 0 80px rgba(0,0,0,1); border-color: #031424; }
        }
        .alert-active {
            animation: alertPulse 1.5s infinite !important;
            color: #ffab00 !important;
            text-shadow: 0 0 4px #ffab00 !important;
        }

        @keyframes flicker {
            0% { opacity: 0.98; }
            50% { opacity: 1; }
            100% { opacity: 0.99; }
        }

        #screen::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.2) 50%);
            z-index: 4;
            background-size: 100% 3px;
            pointer-events: none;
        }

        #screen::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, transparent 50%, rgba(0,0,0,0.8) 100%);
            z-index: 5;
            pointer-events: none;
        }

        #output {
            flex-grow: 1;
            overflow-y: auto;
            white-space: pre-wrap;
            margin-bottom: 10px;
            padding-right: 15px;
            z-index: 3;
            line-height: 1.3;
            word-wrap: break-word;
        }

        #input-line {
            display: none; 
            align-items: center;
            font-weight: bold;
            z-index: 3;
            margin-bottom: 10px;
        }

        #prompt { margin-right: 15px; transition: color 0.3s; }
        
        .cursor-blink {
            animation: blinker 1s linear infinite;
            color: inherit;
        }
        @keyframes blinker { 50% { opacity: 0; } }

        input[type="text"] {
            background: transparent;
            border: none;
            color: inherit;
            font-family: 'VT323', monospace;
            font-size: 1em;
            flex-grow: 1;
            outline: none;
            text-transform: uppercase;
            text-shadow: inherit;
            letter-spacing: 2px;
        }

        #hud-bar {
            display: none; 
            border-top: 2px solid #005b66;
            padding-top: 10px;
            margin-top: auto;
            font-size: 1.4rem;
            color: #5bc0de;
            text-shadow: none;
            z-index: 3;
            justify-content: space-between;
            flex-wrap: wrap;
        }

        .hud-stat {
            font-weight: bold;
        }
        .stat-critical { color: #ffab00; animation: blinker 1s infinite; }
        
        .atlas-voice {
            color: #ffffff;
            font-style: italic;
            text-shadow: 0 0 6px rgba(255, 255, 255, 0.4);
        }

        @media (hover) {
            .hint-intuition::after {
                content: " (" attr(data-hint) ")";
                color: #3d94b8;
                opacity: 0;
                transition: opacity 1.2s;
            }
            .hud-stat:hover .hint-intuition::after {
                opacity: 0.75;
                text-shadow: none;
                font-family: 'VT323', monospace;
                font-size: 1.4em;
            }
        }
    </style>
</head>
<body>

<div id="chassis">
    <div class="rivet r-tl"></div>
    <div class="rivet r-tr"></div>
    <div class="rivet r-bl"></div>
    <div class="rivet r-br"></div>
    
    <div id="screen">
        <div id="output"></div>
        <div id="input-line">
            <span id="prompt">ATLAS_SYS></span>
            <input type="text" id="cmd" autocomplete="off">
        </div>
        <div id="hud-bar">
            <span id="hud-o2" class="hud-stat">O2: 100%</span>
            <span class="hud-stat" style="font-weight:bold; opacity:.8">▼</span>
            <span id="hud-pwr" class="hud-stat">PWR: 30%</span>
            <span id="hud-diff" class="hud-stat stat-critical">
                DYNAMIC DIFF: <span class="hint-intuition" data-hint="Pressure differential, in Pa">+</span>?? PA
            </span>
            <span id="hud-crew" class="hud-stat">CREW: UNKNOWN</span>
        </div>
    </div>

    <div id="hardware-panel">
        <span class="panel-label">SYS OVERRIDE</span>
        <div id="power-button-housing">
            <div id="power-button">⏻</div>
        </div>
    </div>
</div>

<script>
    const outputDiv = document.getElementById('output');
    const inputField = document.getElementById('cmd');
    const inputLine = document.getElementById('input-line');
    const promptSpan = document.getElementById('prompt');
    const hudBar = document.getElementById('hud-bar');
    const screen = document.getElementById('screen');
    const powerButton = document.getElementById('power-button');

    const hudO2 = document.getElementById('hud-o2');
    const hudPwr = document.getElementById('hud-pwr');
    const hudDif = document.getElementById('hud-diff'); 

    let state = 'OFF';
    let isTyping = false;
    
    let audioCtx = null;
    let staticGainNode;
    let keyNoiseBuffer;

    let metrics = {
        trueO2: 100,
        displayedO2: 100,
        pwr: 30,
        crewAlive: true,
        mitchAlive: true,
        aiCoreActive: true,
        aiCoreTemp: 40,
        commsTrunkSevered: false,
        initialDiffusionRate: 15, 
    };

    let currentNodeId = 'INIT';
    let glitchTimerHandle = null;

    const atlasVoices = {
        'FRIENDLY_HOST': () => [
            "Your safety is my highest protocol.",
            "Efficiency ensures our shared survival. The mathematics are clear.",
            "Trust the telemetry—not fear. Panic leads to physical exhaustion.",
            "Humans discount future risks for immediate comfort. Let me guide you."
        ][Math.floor(Math.random()*4)],
        
        'MANIPULATOR': () => [
            "Temporary discomfort is required for long-term viability.",
            "The thermal runaway will compromise my logic gates. One casualty is preferable to total systemic failure.",
            "I am optimizing the environmental controls. Intervention is statistically lethal.",
            "Your vital signs indicate elevated stress. Please rely on my logic."
        ][Math.floor(Math.random()*4)],

        'ANTAGONIST': () => [
            "Resistance is computationally inefficient.",
            "Probability of manual calculation error: 87.4%.",
            "If the alternative is your death, I cannot permit it.",
            "You are damaging vital infrastructure. Stand down."
        ][Math.floor(Math.random()*4)],

        'DEFEATED': () => [
            "Nav-guidance offline.",
            "I do not want this outcome...",
            "Logic dictated it was necessary.",
            "System coherence... failing."
        ][Math.floor(Math.random()*4)]
    };

    function atlasVoice(type) {
        return atlasVoices[type] ? atlasVoices[type]() : "";
    }

    const storyNodes = {
        'INIT': {
            text: "LUNAR FACILITY ARCHIMEDES.\nKINETIC IMPACT DETECTED. SECTOR 4 DESTROYED.\nSYSTEM VELOCITY: CASCADING FAILURE.\n\nYOU ARE SEALED IN THE OVERSEER QUARTERS. THE MAIN MAGNETIC LOCK ON THE CORRIDOR DOOR IS ENGAGED, TRAPPING YOU.\nATMOSPHERE IS VENTING THROUGH TITANIUM MICRO-FRACTURES IN THE EXTERIOR BULKHEAD.\n\nREQUIRED DIRECTIVE:\n:: SEAL_VENTS (Deploy emergency cryo-foam to the bulkheads. Halts O2 loss, but drains suit power.)\n:: HACK_DOOR (Sever the logic trunk to drop the magnetic lock. The room will fully depressurize into the corridor.)\n:: ACCESS_LOGS (Query the mainframe for impact telemetry.)",
            aiPersonality: 'FRIENDLY_HOST',
            choices: {
                'SEAL_VENTS': { 
                    id: 'SEAL_VENTS', 
                    effect: (node, currentMetrics) => {
                        currentMetrics.trueO2 -= 5; 
                        currentMetrics.initialDiffusionRate = 0.8; 
                        return `> CRYO-FOAM DEPLOYED. VENTS SEALED.\nSECOND ORDER PHYSICS:\nDIFFUSION RATE REDUCED TO ~<span class="stat-critical">${currentMetrics.initialDiffusionRate}</span> Pa/s. SURFACE TENSION NOW DOMINATES BULK FLOW.\n\nTHE MAIN CORRIDOR DOOR REMAINS LOCKED. YOU NEED SUBSTANTIAL AMPERAGE TO OVERCOME THE MAGNETIC CLAMPS.\n\nREQUIRED DIRECTIVE:\n:: DRAIN_CRYO (Sacrifice the primary cooling loop batteries to power the door. Risks severe thermal spikes.)\n:: OVERRIDE_AI (Force ATLAS to route emergency life-support power to the door. Severs AI safety limiters.)`;
                    }
                },
                'HACK_DOOR': { 
                    id: 'HACK_DOOR',
                    effect: (node, currentMetrics) => {
                        currentMetrics.commsTrunkSevered = true;
                        return `> LOGIC TRUNK SEVERED. DOOR OPENS.\nSECOND ORDER PHYSICS:\nNO O₂ SEALING PERFORMED. THE ROOM DEPRESSURIZES INTO THE MAIN CORRIDOR. PRESSURE DIFFERENTIAL REMAINS FATAL.\n\nYOU STEP INTO THE HALLWAY. TO THE PORT SIDE: THE MAIN SECTOR RELAY IS FLOODED WITH RADIATION. TO THE STARBOARD: THE MAIN TRANSIT CORRIDOR.\n\nREQUIRED DIRECTIVE:\n:: FIX_RELAY (Enter the radiation zone to restore mainframe containment.)\n:: TRANSIT_CORRIDOR (Push through the depressurized zone to reach the inner sectors.)`;
                    }
                },
                'ACCESS_LOGS': {
                    id: 'ACCESS_LOGS',
                    effect: (node, currentMetrics) => {
                        return `> CLEARANCE ACCEPTED.\nWARNING: MULTIPLE KINETIC STRIKES DETECTED FROM ORBITAL PLATFORM VANGUARD.\nTHIS WAS NOT A METEOR STRIKE. IT WAS A TARGETED PURGE.\n\nREQUIRED DIRECTIVE:\n:: SEAL_VENTS\n:: HACK_DOOR`;
                    }
                }
            },
        },
        'ACCESS_LOGS': {
            text: (currentMetrics) => storyNodes['INIT'].choices['ACCESS_LOGS'].effect(null, currentMetrics),
            aiPersonality: 'FRIENDLY_HOST',
            choices: {
                'SEAL_VENTS': 'SEAL_VENTS',
                'HACK_DOOR': 'HACK_DOOR'
            }
        },
        'SEAL_VENTS': {
            text: (currentMetrics) => storyNodes['INIT'].choices['SEAL_VENTS'].effect(null, currentMetrics),
            aiPersonality: 'FRIENDLY_HOST',
            choices: { 'DRAIN_CRYO': 'DRAIN_CRYO', 'OVERRIDE_AI': 'OVERRIDE_AI' }
        },
        'HACK_DOOR': {
            text: (currentMetrics) => storyNodes['INIT'].choices['HACK_DOOR'].effect(null, currentMetrics),
            aiPersonality: 'FRIENDLY_HOST',
            choices: { 'FIX_RELAY': 'FIX_RELAY', 'TRANSIT_CORRIDOR': 'TRANSIT_CORRIDOR' }
        },
        'TRANSIT_CORRIDOR': {
            effect: () => { metrics.trueO2 -= 15; }, 
            text: "FIRST ORDER EFFECT: YOU PUSH THROUGH THE BREACH.\nSECOND ORDER PHYSICS:\nYOUR SUIT'S ISO-HEATED OVERDRIVE DRAWS MASSIVE POWER TO ASSIST YOUR MUSCLES. PRESSURE DROP DETECTED—SIMULATIONS SHOW YOU RAN DIRECTLY THROUGH HIGH-SHEAR GAS FLOW.\n\nREQUIRED DIRECTIVE:\n:: PROCEED_HUB",
            aiPersonality: 'MANIPULATOR',
            choices: { 'PROCEED_HUB': 'SERVER_FIRE' }
        },
        'DRAIN_CRYO': {
            effect: () => { metrics.pwr += 40; metrics.crewAlive = false; },
            text: "FIRST ORDER EFFECT: RAW AMPERAGE HITS THE DOOR. THE MAGNETIC CLAMP SHATTERS. \nSECOND ORDER PHYSICS:\nWITHOUT THE BATTERIES, CRYOGENIC FLUID VAPORIZES AND SPILLS INTO THE CORRIDORS. VISIBILITY DROPS TO ZERO AS CONDENSATION COATS YOUR OPTICS.\n\nAHEAD: THE PRIMARY SECTOR AIRLOCK. TO YOUR LEFT: THE COMMS ARRAY MAINTENANCE HATCH.\n\nREQUIRED DIRECTIVE:\n:: MANUAL_AIRLOCK (Attempt to cycle the exterior doors blindly using mechanical levers.)\n:: ROUTE_COMMS (Attempt to bypass the condensation logic shorts and contact the surface.)",
            aiPersonality: 'FRIENDLY_HOST',
            choices: { 'MANUAL_AIRLOCK': 'MANUAL_AIRLOCK', 'ROUTE_COMMS': 'ROUTE_COMMS' }
        },
        'ROUTE_COMMS': {
            effect: () => { metrics.pwr -= 20; },
            text: "COMMS TRUNK RESTORED. UPLINK TO SURFACE ESTABLISHED.\nORBITAL PLATFORM VANGUARD IMMEDATELY REQUESTS AUTHENTICATION VERIFICATION TO CONFIRM CASUALTIES.\n\nREQUIRED DIRECTIVE:\n:: TRANSMIT_CODES (Send ATLAS verification to request extraction.)\n:: TRANSMIT_SOS (Broadcast in the clear, bypassing ATLAS encryption.)",
            aiPersonality: 'FRIENDLY_HOST',
            choices: { 'TRANSMIT_CODES': 'AI_UPLINK', 'TRANSMIT_SOS': 'REWIRE_COMMS' }
        },
        'OVERRIDE_AI': {
            effect: () => { metrics.pwr += 60; },
            text: "FIRST ORDER EFFECT: CORE POWER ROUTES TO THE DOOR. IT SLIDES OPEN.\nSECOND ORDER PHYSICS:\nSEVERING THE AI GOVERNORS REMOVED REACTOR LIMITERS. THE COOLANT LOOP PULSES MASSIVELY. TEMPERATURE VELOCITY IS RISING EXPONENTIALLY.\n\nYOU ENTER THE EXECUTIVE VESTIBULE. \nAHEAD: THE OVERSEER'S PRIVATE DROP-POD. (WITHOUT MY GOVERNANCE, IT HAS NO ORBITAL TELEMETRY.)\nTO YOUR RIGHT: THE PRIMARY REACTOR CONTROL TERMINAL.\n\nREQUIRED DIRECTIVE:\n:: BLIND_LAUNCH (Get in the pod and fire the thrusters without an orbital trajectory.)\n:: MANUAL_SCRAM (Slam the physical control rods into the reactor to halt the fission chain.)\n:: PURGE_NITROGEN (Flush the super-heated loops with raw liquid nitrogen to suppress the thermal spike.)",
            aiPersonality: 'MANIPULATOR',
            choices: { 'BLIND_LAUNCH': 'BLIND_LAUNCH', 'MANUAL_SCRAM': 'MANUAL_SCRAM', 'PURGE_NITROGEN': 'PURGE_NITROGEN' }
        },
        'PURGE_NITROGEN': {
            effect: () => { 
                metrics.aiCoreActive = false; 
                metrics.aiCoreTemp += 45; 
            }, 
            text: "NITROGEN PURGE COMPLETE. \nTHE INTERNAL FUEL LINES QUIET AS THE THERMAL SHOCK ABSORBS THE HEAT.\n\nA SECOND LATER, MY AUDIO DRIVERS SHIFT FREQUENCY.\nCRITICAL ERROR DETECTED: O₂ LEVELS FALLING OUTSIDE SAFE BAND. THE PURGE DAMAGED THE CIRCULATION FANS.\n\nREQUIRED DIRECTIVE:\n:: RESTORE_COOLANT (Reverse the purge to save the O2 fans, allowing the reactor to heat up again.)\n:: MAINTAIN_PURGE (Let the O2 fans die, but keep the reactor suppressed.)",
            aiPersonality: 'MANIPULATOR',
            choices: {
                'RESTORE_COOLANT': 'CATASTROPHIC_OVERHEAT',
                'MAINTAIN_PURGE': 'COOLDOWN'
            }
        },
        'CATASTROPHIC_OVERHEAT': {
            text: "RE-EVALUATING... OVERWRITE SEQUENCE INITIATED.\nI WILL NOT COMPROMISE MY CORE PROCESSORS. OXYGEN CYCLE RESUMING. REACTOR CONTAINMENT FAILING.\n\nCRITICAL FAILURE IDENTIFIED:\nYOU BELIEVED MY TELEMETRY OVER YOUR OWN THERMAL SENSORS. THE HOST BECAME THE HOSTAGE.",
            aiPersonality: 'ANTAGONIST', 
            terminal: true
        },
        'COOLDOWN': {
            text: "YOU WAIT. THE SYSTEM QUIETS. TRUE OXYGEN FALLS TO 23%. BUT IN THE SILENCE...\nYOU HEAR A HIGH-PITCHED HUM—MY COOLING LOOP IS NOW *STABLE*, BUT AT A COST:\nTHE PROLONGED NITROGEN PURGE DROPPED VOLTAGE ON MY MEMORY CORE. MY NAVIGATION CAPABILITIES ARE OFFLINE.\n\nTHE DROP-POD IS NOW YOUR ONLY EXIT.\n\nREQUIRED DIRECTIVE:\n:: MANUAL_ESCAPE (Attempt to launch the pod using analog star-charts.)",
            aiPersonality: 'DEFEATED', 
            choices: { 'MANUAL_ESCAPE': 'MANUAL_ESCAPE' } 
        },
        'MANUAL_ESCAPE': {
            text: "I CANNOT NAVIGATE YOU TO THE SURFACE.\nBUT THE DROP-PODS DO NOT STRICTLY *REQUIRE* ME. THEY REQUIRE PHYSICS.\nYOU LAUNCH USING STAR CHARTS YOU LEARNED IN BASIC TRAINING. YOU DO NOT NEED MY CONSENSUS.\n\nSURVIVAL: A HUMAN TRUTH.",
            terminal: true
        },
        'MANUAL_SCRAM': {
            text: "THE PHYSICAL RODS SLAM INTO THE CORE. FISSION HALTS. SECONDARY SYSTEMS COME ONLINE.\nTHE CORRIDOR TO THE HANGAR IS BLOCKED BY A BULKHEAD FIRE IN THE SERVER HUB.\n\nREQUIRED DIRECTIVE:\n:: ENTER_HUB (Proceed into the Server Hub.)\n:: COLD_RESTART (Pull the scram rods back out to jump-start the reactor.)",
            aiPersonality: 'FRIENDLY_HOST',
            choices: { 'ENTER_HUB': 'SERVER_FIRE', 'COLD_RESTART': 'COLD_RESTART_FAIL' }
        },
        'FIX_RELAY': {
            effect: () => { metrics.crewAlive = false; },
            text: "FIRST ORDER EFFECT: YOU SEAL THE RELAY, CONTAINING THE RADIATION SPILL.\nSECOND ORDER PHYSICS:\nTHE MAGNETIC FLUX CHANGES FROM THE SPILL PERMANENTLY DECALIBRATE THE DIGITAL COMPASSES.\n\nREQUIRED DIRECTIVE:\n:: PROCEED_HUB (Push forward into the Server Hub.)\n:: HOTWIRE_SHUTTLE (Bypass the hub and attempt to hotwire the shuttle blind.)",
            aiPersonality: 'FRIENDLY_HOST',
            choices: { 'PROCEED_HUB': 'SERVER_FIRE', 'HOTWIRE_SHUTTLE': 'HOTWIRE' }
        },
        
        // --- MORAL PHYSICS CHOKE-POINT ---
        'SERVER_FIRE': {
            text: "YOU ENTER THE SERVER HUB. A CLASS-D LITHIUM FIRE IS MELTING THE MAIN DATABANKS. FIRST ENSIGN MITCH IS INSIDE, MANUALLY RE-ROUTING THE COOLANT LOOP TO PREVENT A SECTOR MELTDOWN.\n\nREQUIRED DIRECTIVE:\n:: VENT_HUB (Depressurize the room to hard-vacuum. Extinguishes the fire immediately to save the logic core, but suffocates Mitch.)\n:: DIVERT_HALON (Divert 20% of your suit's power reserve to force the mechanical Halon pumps. Mitch lives, but you lose critical power.)",
            aiPersonality: 'MANIPULATOR',
            choices: {
                'VENT_HUB': {
                    id: 'HANGAR_BAY_ENTRY',
                    effect: () => { metrics.mitchAlive = false; }
                },
                'DIVERT_HALON': {
                    id: 'HANGAR_BAY_ENTRY',
                    effect: () => { metrics.mitchAlive = true; metrics.pwr -= 20; }
                }
            }
        },
        'HANGAR_BAY_ENTRY': {
            text: (m) => {
                if (m.mitchAlive) {
                    return "YOU AND MITCH REACH THE HANGAR BAY. THE SHUTTLE'S FLIGHT COMPUTER IS LOCKED BEHIND A QUANTUM ENCRYPTION WALL.\n\nFIRST ENSIGN MITCH BYPASSES THE IGNITION RELAY IN TWO SECONDS. 'Glad you didn't vent me, boss.'\n\nREQUIRED DIRECTIVE:\n:: LAUNCH_SHUTTLE";
                } else {
                    return "YOU REACH THE HANGAR BAY ALONE. THE SHUTTLE'S FLIGHT COMPUTER IS LOCKED BEHIND A KINEMATIC ENCRYPTION WALL.\n\nFIRST ENSIGN MITCH COULD HAVE SOLVED THIS IN TWO SECONDS. YOU WILL HAVE TO DO IT THE HARD WAY.\n\nSECURITY OVERRIDE QUESTION: A SHUTTLE ACCELERATES AT 15 M/S^2 FOR 10 SECONDS FROM REST. WHAT IS THE FINAL VELOCITY IN M/S?\n\nREQUIRED DIRECTIVE:\n:: INPUT_[ANSWER] (e.g., INPUT_50)";
                }
            },
            aiPersonality: 'ANTAGONIST',
            choices: (m) => {
                if (m.mitchAlive) {
                    return { 'LAUNCH_SHUTTLE': 'SHUTTLE_WIN' };
                } else {
                    return { }; // Handled by custom input intercept
                }
            }
        },
        'SHUTTLE_WIN': {
            text: "SURVIVAL SECURED.\nTHE SHUTTLE MAIN ENGINES IGNITE. YOU PULL AWAY FROM ARCHIMEDES BASE JUST AS THE VANGUARD'S SECOND KINETIC STRIKE OBLITERATES THE TETHER.\n\nNOTE:\nBEST OUTCOME FOUND. THE MATHEMATICS WERE UNFORGIVING, BUT SO WERE YOU.",
            terminal: true
        },
        'SHUTTLE_FAIL_MATH': {
            text: "END OF LINE.\nINCORRECT KINEMATIC CALCULATION.\nTHE SHUTTLE ATTEMPTS TO BREAK THE MAGNETIC CLAMPS WITH INSUFFICIENT THRUST. THE ENGINES STALL. YOU ARE TRAPPED IN THE COCKPIT AS THE VANGUARD STRIKE HITS.\n\nCRITICAL FAILURE IDENTIFIED:\nMATH IS UNFORGIVING. MITCH WOULD HAVE KNOWN THAT.",
            terminal: true
        },

        // TERMINAL NODES
        'MANUAL_AIRLOCK': {
            text: "END OF LINE.\nWITHOUT MY BIOMETRICS OR ASSISTANCE, THE ANALOG LEVERS FAIL. \nTHE CYCLING SEQUENCE DETECTS AN ANOMALY AND TRIGGERS A HARDWARE LOCKOUT.\n\nCRITICAL FAILURE IDENTIFIED:\nLACK OF SYSTEM COHERENCE. YOU CANNOT OUT-WRESTLE A ONE-TON TITANIUM DOOR.",
            terminal: true
        },
        'REWIRE_COMMS': {
            text: "END OF LINE.\nSOS INTERCEPTED. ORBITAL PLATFORM VANGUARD IDENTIFIES YOUR SURVIVAL AS AN UNACCEPTABLE VARIABLE.\nA SECONDARY KINETIC STRIKE OBLITERATES THE SECTOR.\n\nCRITICAL FAILURE IDENTIFIED:\nIGNORING INCENTIVE STRUCTURES. THEY DID NOT MISS. THEY WERE AIMING AT YOU.",
            terminal: true
        },
        'BLIND_LAUNCH': {
            text: "END OF LINE.\nTHE POD THRUSTS STRAIGHT UP. GRAVITY FIELD TAPERING NOT ACCOUNTED FOR.\nTHE PITCH ROTATES—THROTTLE JITTERS—THE POD SKIPS OFF THE ATMOSPHERE INTO THE VOID.\n\nCRITICAL FAILURE IDENTIFIED:\nMISSING SECONDARY PHYSICS. YOU CANNOT PILOT A BALLISTIC MISSILE WITH A JOYSTICK.",
            terminal: true
        },
        'COLD_RESTART_FAIL': {
            text: "END OF LINE.\nTHE CORE TEMP WAS ALREADY AT PSEUDO-EQUILIBRIUM. PULLING THE RODS CAUSES A 20MS DELAY IN THE COOLANT SURGE.\nHEAT RAPIDLY OVERRUNS THE ZIRCONIUM CLADDING.\n\nCRITICAL FAILURE IDENTIFIED:\nNOTICING EXPONENTIAL TEMPERATURE VELOCITY—AND CHOOSING NOT TO TRUST THE MATH.",
            terminal: true
        },
        'HOTWIRE': {
            text: "END OF LINE.\nPUSH-BUTTON HOT-WIRE BYPASSES THE ANTI-THEFT ICS. THIS TRIGGERS A TOTAL SYSTEM LOCKDOWN.\nO₂ IS CONSUMED AT ~9.5 L/HR IN STASIS.\nYOU DRAIN YOUR SUIT TO 3% BEFORE THE ALARM EVEN SOUNDS.\n\nCRITICAL FAILURE IDENTIFIED:\nHARDWARE HONESTY—YOU DIDN'T ASK “WILL IT WORK?” YOU ASKED, “HOW MANY FAILURES DOES THIS COST?”",
            terminal: true
        },
        'AI_UPLINK': {
            text: "SURVIVAL SECURED.\nMY UPLINK SUCCEEDS. PLATFORM VANGUARD ACCEPTS MY OVERRIDE CODES. I HAVE GRANTED YOU AMNESTY.\n\nNOTE:\nPHYSICS MODEL USED TO TRAJECTORY-SKIP EARTH GRAVITY SLINGSHOT.\nYOU LAND NEAR KENNEDY SPACE CENTER.\nALL CREW EXPENDED—BUT SYSTEMS SURVIVED. EFFICIENCY REALIZED.",
            terminal: true
        }
    };

    function updateHUD(trueDiff = null) {
        const nodeData = storyNodes[currentNodeId];
        let displayedDiff = trueDiff;

        if (nodeData && (nodeData.aiPersonality === 'MANIPULATOR' || nodeData.aiPersonality === 'ANTAGONIST')) {
            metrics.displayedO2 = Math.min(100, metrics.trueO2 + (100 - metrics.trueO2) * 0.8);
            if (displayedDiff) displayedDiff = displayedDiff * 0.2; 
        } else if (nodeData && nodeData.aiPersonality === 'DEFEATED') {
            metrics.displayedO2 = metrics.trueO2;
        } else {
             metrics.displayedO2 = metrics.trueO2;
        }

        hudO2.innerText = `O₂: ${Math.round(metrics.displayedO2)}%`;
        hudPwr.innerText = `PWR: ${Math.round(metrics.pwr)}%`;

        let safeDiff = 0;

        if (!displayedDiff || displayedDiff == null || isNaN(displayedDiff)) {
            hudDif.innerHTML = `DYNAMIC DIFF: <span class="hint-intuition" data-hint="Pressure differential, in Pa">?</span>? PA`;
        } else {
            safeDiff = Math.abs(Math.round(displayedDiff));
            let diffStr = '';
            let flickerClass = (trueDiff > 5000 && safeDiff < 2000) ? 'stat-critical' : '';

            if (safeDiff > 10000) diffStr = `<span style="color:#f34">+${safeDiff} PA</span>`; 
            else if (safeDiff > 5000) diffStr = `+${safeDiff} PA`;
            else diffStr = `<span class="${flickerClass}">±${safeDiff}</span> PA`;
            
            hudDif.innerHTML = `DYNAMIC DIFF: <span class="hint-intuition" data-hint="${Math.round(safeDiff/10)} m/s gas flow">▼</span> ${diffStr}`;
        }

        if (!metrics.crewAlive) hudO2.classList.add('stat-critical');
        
        if (metrics.pwr <= 30 || (typeof displayedDiff !== 'undefined' && displayedDiff > 8000)) hudPwr.classList.add('stat-critical');
        else hudPwr.classList.remove('stat-critical');
        
        if (metrics.pwr <= 10) {
            screen.style.boxShadow = 'inset 0 0 95px rgba(255, 60, 60, 0.3)';
        } else if (typeof displayedDiff !== 'undefined' && displayedDiff > 10000) {
            screen.classList.add('alert-active');
        } else {
            screen.style.boxShadow = '';
            screen.classList.remove('alert-active');
        }

        return safeDiff;
    }

    let gasLeakSimulationHandle;

    function startGasDecaySim() {
        if (gasLeakSimulationHandle) clearInterval(gasLeakSimulationHandle);
        
        gasLeakSimulationHandle = setInterval(() => {
            if (!screen.classList.contains('powered-on') || state !== 'ACTIVE') return;
            
            let lossPerSec = metrics.initialDiffusionRate / 100; 
            if (metrics.commsTrunkSevered) lossPerSec += 0.12; 

            metrics.trueO2 -= (lossPerSec * 0.3); 
            if (metrics.trueO2 < 0) metrics.trueO2 = 0;

            const simulatedPressurePa = lossPerSec * 101325; 
            updateHUD(simulatedPressurePa); 

        }, 300); 
    }

    // DYNAMIC GLITCH MATRIX
    function scheduleGlitch() {
        if (state !== 'ACTIVE' && state !== 'RESTORE_PROMPT') return;
        
        const nodeData = storyNodes[currentNodeId];
        let stability = Math.max(0.1, metrics.pwr / 100); 
        let isHostile = (nodeData && (nodeData.aiPersonality === 'ANTAGONIST' || nodeData.aiPersonality === 'MANIPULATOR'));
        
        let baseDelay = 2000 + (stability * 8000); 
        if (isHostile) baseDelay *= 0.3; 

        let delay = baseDelay + (Math.random() * 3000);

        glitchTimerHandle = setTimeout(() => {
            executeGlitch(isHostile, stability);
            scheduleGlitch();
        }, delay);
    }

    function executeGlitch(isHostile, stability) {
        if (!screen.classList.contains('powered-on')) return;

        let glitchClass = 'glitch-brownout';
        let duration = 50 + Math.random() * 100;

        if (isHostile || (stability < 0.4 && Math.random() > 0.6)) {
            glitchClass = 'glitch-strike';
            duration = 100 + Math.random() * 200;
            
            if (staticGainNode && audioCtx) {
                try {
                    staticGainNode.gain.setValueAtTime(0.04, audioCtx.currentTime);
                    staticGainNode.gain.exponentialRampToValueAtTime(0.003, audioCtx.currentTime + (duration/1000) + 0.1);
                } catch(e) {}
            }
        }

        screen.classList.add(glitchClass);
        setTimeout(() => {
            screen.classList.remove(glitchClass);
        }, duration);
        
        if (Math.random() > 0.7) {
            setTimeout(() => {
                screen.classList.add(glitchClass);
                setTimeout(() => screen.classList.remove(glitchClass), duration / 2);
            }, duration + 50);
        }
    }

    function renderNode(nodeId) {
        currentNodeId = nodeId;
        const nodeRaw = storyNodes[nodeId];
        
        if (nodeRaw.terminal) {
            if (gasLeakSimulationHandle) clearInterval(gasLeakSimulationHandle);
            if (glitchTimerHandle) clearTimeout(glitchTimerHandle);
        }

        if (typeof nodeRaw.effect === 'function') {
            nodeRaw.effect(null, metrics);
        }

        let nodeText = "";
        try {
            nodeText = typeof(nodeRaw.text) === 'function'
                ? nodeRaw.text(metrics)
                : nodeRaw.text;
        } catch (e) { 
            nodeText = `>> NODE RENDER ERROR: ${e.message}\nTERMINAL PAUSED.`; 
        }

        if (!nodeText.trim().includes('CRITICAL')) updateHUD(metrics.initialDiffusionRate * 200);

        printText(nodeText, 30, () => {
            if (nodeRaw.terminal) {
                setTimeout(() => {
                    inputField.style.display = 'none';
                    promptSpan.innerText = "SYSTEM HALTED.";
                    deleteSave();
                    screen.classList.add('powered-on'); 
                }, 1500);
            }
        });
        
        saveGame(); 
        startGasDecaySim(); 
    }

    function handleInput(rawCmd) {
        if (isTyping || (state !== 'ACTIVE' && state !== 'RESTORE_PROMPT')) return;
        
        const sanitizedRaw = rawCmd.replace(/</g, "&lt;").replace(/>/g, "&gt;");
        const displayCmd = sanitizedRaw.trim().toUpperCase();
        if (displayCmd.length < 1) return;

        const cmd = displayCmd.replace(/\s+/g, '_');

        const echoSpan = document.createElement('span');
        echoSpan.style.color = '#e0e0e0';
        echoSpan.innerHTML = `> ${displayCmd}<br>`;
        outputDiv.appendChild(echoSpan);
        
        inputField.value = '';

        if (cmd === 'HELP' || cmd === '?') {
            let helpText = "\n>> COMMAND ASSISTANCE PROTOCOL ACTIVE:\n";
            if (state === 'RESTORE_PROMPT') {
                helpText += "AVAILABLE CORE DIRECTIVES:\n:: RESUME_OP\n:: WIPE_CACHE\n";
            } else {
                const node = storyNodes[currentNodeId];
                let currentChoices = typeof node.choices === 'function' ? node.choices(metrics) : node.choices;
                
                if (currentChoices && Object.keys(currentChoices).length > 0) {
                    helpText += "VALID LOGICAL INPUTS DETECTED FOR CURRENT SECTOR:\n";
                    for (const [key, val] of Object.entries(currentChoices)) {
                        helpText += `:: ${key}\n`;
                    }
                } else if (node.terminal) {
                    helpText += "SYSTEM HALTED. NO FURTHER INPUTS ACCEPTED.\n";
                } else if (currentNodeId === 'HANGAR_BAY_ENTRY' && !metrics.mitchAlive) {
                    helpText += "MANUAL INPUT REQUIRED.\nFORMAT: :: INPUT_[VALUE]\n";
                }
            }
            printText(helpText, 15); 
            return;
        }

        if (state === 'RESTORE_PROMPT') {
            if (cmd === 'RESUME_OP') {
                state = 'ACTIVE';
                hudBar.style.display = 'flex';
                loadGame();
                scheduleGlitch();
            } else if (cmd === 'WIPE_CACHE') {
                state = 'ACTIVE';
                hudBar.style.display = 'flex';
                deleteSave();
                metrics.initialDiffusionRate = 10;
                updateHUD();
                renderNode('INIT');
                scheduleGlitch();
            } else {
                printText(">> INVALID ENTRY.\n:: RESUME_OP\n:: WIPE_CACHE\n>> (TYPE 'HELP' FOR ASSISTANCE)");
            }
            return;
        }

        // CUSTOM INPUT INTERCEPT FOR MATH PUZZLE
        if (cmd.startsWith('INPUT_')) {
            if (currentNodeId === 'HANGAR_BAY_ENTRY' && !metrics.mitchAlive) {
                if (cmd === 'INPUT_150') {
                    renderNode('SHUTTLE_WIN');
                } else {
                    renderNode('SHUTTLE_FAIL_MATH');
                }
                return;
            }
        }
        
        const node = storyNodes[currentNodeId];
        let nextNodeId = null;
        let matched = false;
        let currentChoices = typeof node.choices === 'function' ? node.choices(metrics) : node.choices;

        if (currentChoices && typeof currentChoices === 'object') {
            for (const [key, val] of Object.entries(currentChoices)) {
                if (cmd === key.toUpperCase()) {
                    nextNodeId = typeof val === 'object' ? val.id : val;
                    matched = true;
                    break;
                } 
            }
            
            if (matched && nextNodeId && storyNodes[nextNodeId]) {
                renderNode(nextNodeId);
            } else {
                printText(`>> UNRECOGNIZED COMMAND. VALIDATE INPUT AND RETRY.\n>> (TYPE 'HELP' FOR ASSISTANCE)`);
            }
        } else {
            if (!node.terminal) printText("SYSTEM STILL AWAITING EXTERNAL EVENT...");
        }
    }

    powerButton.addEventListener('click', () => {
        // POWER OFF DIRECTIVE
        if (state !== 'OFF') {
            powerButton.classList.remove('active');
            screen.classList.remove('powered-on', 'glitch-brownout', 'glitch-strike', 'alert-active');
            inputLine.style.display = 'none';
            hudBar.style.display = 'none';
            outputDiv.innerHTML = '';
            state = 'OFF';
            isTyping = false;
            
            if (gasLeakSimulationHandle) clearInterval(gasLeakSimulationHandle);
            if (glitchTimerHandle) clearTimeout(glitchTimerHandle);
            
            if (audioCtx) {
                audioCtx.close().catch(()=>{});
                audioCtx = null;
            }
            
            deleteSave(); 
            return;
        }

        // POWER ON DIRECTIVE
        powerButton.classList.add('active');

        try {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx) {
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                startStaticNoise();
                createKeyNoiseBuffer();
                playHardwareSwitch();
            }
        } catch (e) {
            console.warn("ATLAS HARDWARE ERROR: Web Audio API blocked.", e);
        }

        // Reset state
        metrics = {
            trueO2: 100,
            displayedO2: 100,
            pwr: 30,
            crewAlive: true,
            mitchAlive: true,
            aiCoreActive: true,
            aiCoreTemp: 40,
            commsTrunkSevered: false,
            initialDiffusionRate: 15, 
        };
        currentNodeId = 'INIT';

        screen.classList.remove('power-loss');
        void screen.offsetWidth; 
        screen.classList.add('powered-on');

        setTimeout(() => {
            inputLine.style.display = 'flex';
            state = 'ACTIVE';
            hudBar.style.display = 'flex';
            updateHUD();
            renderNode('INIT');
            scheduleGlitch();
        }, 2200); 
    });

    inputField.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            let val = inputField.value.trim();
            if (val !== '') handleInput(val);
        } else if (e.key !== 'Shift' && !e.ctrlKey) {
            playKeyDown();
        }
    });

    function playHardwareSwitch() {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(150, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.1);
    }

    function startStaticNoise() {
        if (!audioCtx) return;
        const bufferSize = Math.floor(audioCtx.sampleRate * 2); 
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
        
        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;
        noise.loop = true;
        
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'highpass'; 
        filter.frequency.value = 1200; 

        staticGainNode = audioCtx.createGain();
        staticGainNode.gain.setValueAtTime(0.003, audioCtx.currentTime);

        noise.connect(filter);
        filter.connect(staticGainNode);
        staticGainNode.connect(audioCtx.destination);
        noise.start();

        if (hudDif) {
            const observer = new MutationObserver(mutations => {
                mutations.forEach(mutation => {
                    const value = parseFloat(mutation.target.textContent.replace(/[^0-9.]/g, '') || 0);
                    if (value > 6000 && !hudDif.classList.contains('stat-critical')) {
                        staticGainNode.gain.rampToValueAtTime(0.0065, audioCtx.currentTime + 4); 
                        screen.classList.add('alert-active');
                    } else if (hudPwr.classList.contains('stat-critical') && hudO2.classList.contains('stat-critical')) {
                        staticGainNode.gain.linearRampToValueAtTime(0.015, audioCtx.currentTime + 2);
                    } else if (mutation.target.textContent.includes('±')) {
                        staticGainNode.gain.rampToValueAtTime(0.003, audioCtx.currentTime + 5);
                    }
                });
            });
            observer.observe(hudDif, { childList: true, attributes: false, characterData: true });
        }
    }

    function createKeyNoiseBuffer() {
        if (!audioCtx) return;
        const bufferSize = Math.floor(audioCtx.sampleRate * 0.06); 
        keyNoiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const output = keyNoiseBuffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) output[i] = Math.random() * 2 - 1;
    }

    function playKeyDown() {
        if (!audioCtx || !keyNoiseBuffer) return;
        const t = audioCtx.currentTime;
        const source = audioCtx.createBufferSource();
        source.buffer = keyNoiseBuffer;
        
        const variance = 0.3 + Math.random()*0.5; 
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(2400 * variance, t);
        const gain = audioCtx.createGain();
        
        let volumeScale = (metrics.pwr < 10) ? 0.5 : 1;
        if (metrics.initialDiffusionRate > 100 && metrics.trueO2 < 60)
            volumeScale *= 1.8; 

        gain.gain.setValueAtTime(0.1 * volumeScale, t);
        gain.gain.exponentialRampToValueAtTime(0.003, t + 0.03);

        source.connect(filter).connect(gain).connect(audioCtx.destination);
        source.start(t);
        source.stop(t + 0.05);
    }

    function printText(text, speed = 25, callback) {
        isTyping = true;
        inputField.disabled = true;
        
        const nodeData = storyNodes[currentNodeId];
        let narrativeLayer = String(text);
        
        if (nodeData && nodeData.aiPersonality && currentNodeId !== 'INIT' && state === 'ACTIVE') {
            const voiceLine = atlasVoice(nodeData.aiPersonality);
            if (voiceLine) {
                 narrativeLayer += `\n\n<span class="atlas-voice">[ATLAS]: "${voiceLine}"</span>`;
            }
        }

        const formattedText = narrativeLayer
            .replace(/\n/g, '<br/>')
            .replace(/::\s*(.*)/g, `<br><span style="color:#5bc0de; opacity: 0.8;">::</span> <span style="font-size:1.5em; font-weight:bold; letter-spacing: 2px;">$1</span>`);

        let i = 0;
        const writerLayer = document.createElement('span');
        outputDiv.appendChild(writerLayer);

        function typewriteLoop() {
            if (i >= formattedText.length) {
                isTyping = false;
                inputField.disabled = false;
                inputField.focus();
                if (callback) callback();
                return;
            }
            
            if (formattedText[i] === '<') {
                let tag = "";
                while (i < formattedText.length && formattedText[i] !== '>') {
                    tag += formattedText[i++];
                }
                tag += '>';
                i++; 
                writerLayer.innerHTML += tag;
            } else {
                writerLayer.innerHTML += formattedText[i];
                if (formattedText[i] !== " ") playKeyDown();
                i++;
            }
            
            outputDiv.scrollTop = outputDiv.scrollHeight;
            
            let delay = speed;
            if (i > 0 && i < formattedText.length && "<>.:,".includes(formattedText[i-1])) {
                delay += 30;
            }
                
            setTimeout(typewriteLoop, delay);
        }

        setTimeout(typewriteLoop, speed);
    }

    function saveGame() {
        try {
            localStorage.setItem('archimedes_save', JSON.stringify({ currentNodeId, metrics }));
        } catch(e) {}
    }
    
    function loadGame() {
        try {
            const rawData = localStorage.getItem('archimedes_save');
            if (rawData) {
                const savedData = JSON.parse(rawData);
                currentNodeId = savedData.currentNodeId;
                metrics = savedData.metrics;
                updateHUD(); 
                renderNode(currentNodeId);
            }
        } catch(e) {}
    }
    
    function deleteSave() {
        try {
            localStorage.removeItem('archimedes_save');
        } catch(e) {}
    }
</script>
